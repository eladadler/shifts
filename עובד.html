<script>
/* ===== PWA: Service Worker + Push Notifications ===== */

// ---- IndexedDB helpers (shared with SW) ----
function _openIDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open('mishmarot', 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore('kv');
    req.onsuccess = e => res(e.target.result);
    req.onerror = rej;
  });
}
async function idbSet(key, value) {
  const db = await _openIDB();
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(value, key);
    tx.oncomplete = res; tx.onerror = rej;
  });
}
async function idbGet(key) {
  const db = await _openIDB();
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readonly');
    const req = tx.objectStore('kv').get(key);
    req.onsuccess = () => res(req.result); req.onerror = rej;
  });
}

// ---- VAPID helper ----
function urlBase64ToUint8Array(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const base64 = (b64 + pad).replace(/-/g, '+').replace(/_/g, '/');
  return Uint8Array.from(atob(base64), c => c.charCodeAt(0));
}

// ---- Register SW ----
window.__swReg = null;
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .then(reg => {
        window.__swReg = reg;
        // הרשמה ל-Periodic Background Sync (Chrome)
        if ('periodicSync' in reg) {
          reg.periodicSync.register('shift-check', { minInterval: 30 * 60 * 1000 }).catch(() => {});
        }
      })
      .catch(err => console.warn('SW registration failed:', err));
  });
}

// ---- Subscribe to push (called after login) ----
window.subscribeToPush = async function(empId, vapidPublicKey) {
  try {
    if (!('Notification' in window)) return;
    if (!('PushManager' in window)) return;
    const reg = window.__swReg || await navigator.serviceWorker.ready;
    if (!reg) return;

    // Request permission
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return;

    // Store empId in IndexedDB (the SW reads it)
    await idbSet('empId', empId);

    // Subscribe to push manager
    const appKey = urlBase64ToUint8Array(vapidPublicKey);
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: appKey });

    // Save subscription to Supabase
    const SB_URL = 'https://ajniglpdgkwnasuslsyc.supabase.co';
    const SB_KEY = 'sb_publishable_zMTTfShJSVqKaGRYlYoqFA_9y_5Q5hk';
    await fetch(`${SB_URL}/rest/v1/push_subscriptions`, {
      method: 'POST',
      headers: {
        apikey: SB_KEY, 'Content-Type': 'application/json',
        Prefer: 'resolution=merge-duplicates',
      },
      body: JSON.stringify({
        emp_id: empId,
        subscription: sub.toJSON(),
        updated_at: new Date().toISOString(),
      }),
    });

    console.log('[PWA] Push subscription saved for', empId);
    return true;
  } catch (err) {
    console.warn('[PWA] subscribeToPush failed:', err);
    return false;
  }
};
</script>

<script type="text/babel">
/* ============ Supabase ============ */
const SB_URL = 'https://ajniglpdgkwnasuslsyc.supabase.co';
const SB_KEY = 'sb_publishable_zMTTfShJSVqKaGRYlYoqFA_9y_5Q5hk';
const sb = supabase.createClient(SB_URL, SB_KEY);

/* ============ חילופי משמרות — קריאה ל-Edge Function ============ */
async function callSwaps(action, payload) {
  const res = await fetch(`${SB_URL}/functions/v1/swaps`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SB_KEY}`, 'apikey': SB_KEY },
    body: JSON.stringify({ action, ...payload }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.error) throw new Error(data.error || `שגיאת שרת (${res.status})`);
  return data;
}

/* ============ תאריכים ============ */
const HEB_DAYS = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
const HEB_MONTHS = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];
const pad = (n) => String(n).padStart(2, '0');
const parseDate = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const dateStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return dateStr(d); };
const weekdayOf = (s) => parseDate(s).getDay();
const monthLabel = (ym) => { const [y, m] = ym.split('-').map(Number); return `${HEB_MONTHS[m - 1]} ${y}`; };
const monthName = (ym) => HEB_MONTHS[Number(ym.split('-')[1]) - 1];
const inMonthLabel = (ym) => 'ב' + monthName(ym);
const addMonths = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const daysInMonth = (ym) => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const monthOffset = (ym) => weekdayOf(ym + '-01');
const todayStr = () => dateStr(new Date());
const thisMonth = () => todayStr().slice(0, 7);
const diffDays = (a, b) => Math.round((parseDate(b) - parseDate(a)) / 86400000);

/* ============ חגי ישראל — אותה לוגיקה כמו אצל המשבץ; תצוגה בלבד ============ */
const HEB_FMT = new Intl.DateTimeFormat('en-u-ca-hebrew', { day: 'numeric', month: 'numeric', year: 'numeric' });
const hebrewParts = (date) => { const o = {}; HEB_FMT.formatToParts(date).forEach(p => { o[p.type] = p.value; }); return o; };
const HEBREW_FIXED_HOLIDAYS = [
  { month: 'Tishri', day: 1, name: 'ראש השנה' }, { month: 'Tishri', day: 2, name: 'ראש השנה' },
  { month: 'Tishri', day: 3, name: 'צום גדליה', fast: true },
  { month: 'Tishri', day: 10, name: 'יום כיפור' },
  { month: 'Tishri', day: 15, name: 'סוכות' },
  { month: 'Tishri', day: 16, name: 'חול המועד סוכות' }, { month: 'Tishri', day: 17, name: 'חול המועד סוכות' },
  { month: 'Tishri', day: 18, name: 'חול המועד סוכות' }, { month: 'Tishri', day: 19, name: 'חול המועד סוכות' },
  { month: 'Tishri', day: 20, name: 'חול המועד סוכות' },
  { month: 'Tishri', day: 21, name: 'הושענא רבה' },
  { month: 'Tishri', day: 22, name: 'שמחת תורה' },
  { month: 'Kislev', day: 25, name: 'חנוכה' }, { month: 'Kislev', day: 26, name: 'חנוכה' },
  { month: 'Kislev', day: 27, name: 'חנוכה' }, { month: 'Kislev', day: 28, name: 'חנוכה' },
  { month: 'Kislev', day: 29, name: 'חנוכה' }, { month: 'Kislev', day: 30, name: 'חנוכה' },
  { month: 'Tevet', day: 1, name: 'חנוכה' }, { month: 'Tevet', day: 2, name: 'חנוכה' },
  { month: 'Tevet', day: 10, name: 'עשרה בטבת', fast: true },
  { month: 'Shevat', day: 15, name: 'ט״ו בשבט' },
  { month: ['Adar', 'Adar II'], day: 14, name: 'פורים' }, { month: ['Adar', 'Adar II'], day: 15, name: 'שושן פורים' },
  { month: 'Nisan', day: 15, name: 'פסח' },
  { month: 'Nisan', day: 16, name: 'חול המועד פסח' }, { month: 'Nisan', day: 17, name: 'חול המועד פסח' },
  { month: 'Nisan', day: 18, name: 'חול המועד פסח' }, { month: 'Nisan', day: 19, name: 'חול המועד פסח' },
  { month: 'Nisan', day: 20, name: 'חול המועד פסח' },
  { month: 'Nisan', day: 21, name: 'שביעי של פסח' },
  { month: 'Nisan', day: 27, name: 'יום השואה' },
  { month: 'Iyar', day: 18, name: 'ל״ג בעומר' },
  { month: 'Iyar', day: 28, name: 'יום ירושלים' },
  { month: 'Sivan', day: 6, name: 'שבועות' },
  { month: 'Tamuz', day: 17, name: 'שבעה עשר בתמוז', fast: true },
  { month: 'Av', day: 9, name: 'תשעה באב', fast: true },
];
// ה׳ באייר תמיד נופל בשני/רביעי/שישי/שבת. הכלל הרשמי: שבת→ג׳, שישי→ד׳, שני→ו׳, רביעי→ללא שינוי.
const independenceDayInfo = (date) => {
  const h = hebrewParts(date);
  if (h.month !== 'Iyar') return null;
  const day = Number(h.day);
  if (day < 2 || day > 6) return null;
  const weekday5 = ((date.getDay() + (5 - day)) % 7 + 7) % 7;
  const observed = weekday5 === 6 ? 3 : weekday5 === 5 ? 4 : weekday5 === 1 ? 6 : 5;
  if (day === observed) return 'יום העצמאות';
  if (day === observed - 1) return 'יום הזיכרון';
  return null;
};
const hebrewHolidayOf = (date) => {
  const iday = independenceDayInfo(date);
  if (iday) return iday;
  const h = hebrewParts(date);
  const day = Number(h.day);
  const findFast = (hh, dd) => HEBREW_FIXED_HOLIDAYS.find((e) => e.fast
    && (Array.isArray(e.month) ? e.month.includes(hh.month) : e.month === hh.month) && e.day === dd);
  if (date.getDay() === 0) {
    const y = new Date(date.getTime() - 864e5);
    const pushed = findFast(hebrewParts(y), Number(hebrewParts(y).day));
    if (pushed) return pushed.name;
  }
  if (date.getDay() === 6 && findFast(h, day)) return null;
  const hit = HEBREW_FIXED_HOLIDAYS.find((e) => (Array.isArray(e.month) ? e.month.includes(h.month) : e.month === h.month) && e.day === day);
  return hit ? hit.name : null;
};

/* ============ הגדרות משמרות — אותה לוגיקה כמו אצל המשבץ ============ */
const WEEKDAY_SHIFTS = [
  { id: 'morning', name: 'בוקר', start: '09:00', end: '21:00' },
  { id: 'evening', name: 'בוקר קצר', start: '09:00', end: '20:00' },
  { id: 'night', name: 'לילה', start: '21:00', end: '09:00' },
];
const WEEKEND_SHIFTS = [
  { id: 'morning', name: 'בוקר', start: '09:00', end: '21:00' },
  { id: 'short', name: 'קצר', start: '15:00', end: '19:00' },
  { id: 'night', name: 'לילה', start: '21:00', end: '09:00' },
];
const getBase = (dayStr, settings) => {
  const wd = weekdayOf(dayStr);
  if (settings) {
    if (wd === 6) return settings.saturday || settings.weekend || WEEKEND_SHIFTS;
    if (wd === 5) return settings.friday || settings.weekend || WEEKEND_SHIFTS;
    return settings.weekday || WEEKDAY_SHIFTS;
  }
  return (wd === 5 || wd === 6) ? WEEKEND_SHIFTS : WEEKDAY_SHIFTS;
};
// זהה ללוגיקה של המשבץ: משמרת מיוחדת (חג/זמנית) מחליפה את משמרות הבסיס ביום שלה
// ובימי ההמשך שלה (daysSpan), ומשמרות בסיס רב-יומיות מסומנות כהמשך בימים הבאים
// דריסות פר-מופע שהמשבץ הגדיר (shift_settings._overrides) — חייב להישאר זהה למשבץ
const atTime = (dStr, hm) => { const d = parseDate(dStr); const [h, m] = String(hm).split(':').map(Number); d.setHours(h, m, 0, 0); return d; };
const nearestClock = (anchor, hm) => {
  const DAY = 864e5;
  const base = atTime(dateStr(anchor), hm).getTime();
  let best = base;
  [base - DAY, base + DAY].forEach(c => { if (Math.abs(c - anchor.getTime()) < Math.abs(best - anchor.getTime())) best = c; });
  return new Date(best);
};
const applyOverrides = (s, settings, list) => {
  const all = settings?._overrides;
  if (!all) return list;
  return list.map(sh => {
    const ov = all[sh.continuation ? sh.originDate : s]?.[sh.id];
    if (!ov) return sh;
    return { ...sh, start: ov.start || sh.start, end: ov.end || sh.end,
      _startDayOffset: ov.startDayOffset || 0, _per: ov.per || null };
  });
};
const shiftTimesOf = (s, shift) => {
  const base = shift?._startDayOffset ? addDays(s, shift._startDayOffset) : s;
  const start = atTime(base, shift.start);
  // משמרת רב-יומית נגמרת ביום האחרון שהיא תופסת, לא למחרת ההתחלה
  const lastDay = addDays(base, Math.max(1, shift.daysSpan || 1) - 1);
  let end = atTime(lastDay, shift.end);
  if (end <= start) end = atTime(addDays(lastDay, 1), shift.end);
  return { start, end };
};
const personTimes = (s, shift, empId) => {
  const block = shiftTimesOf(s, shift);
  const p = shift?._per?.[empId];
  if (!p || (!p.start && !p.end)) return block;
  const start = p.start ? nearestClock(block.start, p.start) : block.start;
  let end = block.end;
  if (p.end) {
    const sd = dateStr(start);
    end = atTime(sd, p.end);
    if (end <= start) end = atTime(addDays(sd, 1), p.end);
  }
  if (end <= start) end = new Date(start.getTime() + 36e5);
  return { start, end };
};
const hasPersonTimes = (shift, empId) => { const p = shift?._per?.[empId]; return !!(p && (p.start || p.end)); };
const fmtHM = (d) => pad(d.getHours()) + ':' + pad(d.getMinutes());

const shiftTypesFor = (s, settings) => {
  const special = settings?.special || [];
  const directSpecial = special.filter(sp => sp.date === s);
  const contSpecial = [];
  special.forEach(sp => {
    const span = sp.daysSpan || 1;
    for (let i = 1; i < span; i++) {
      if (addDays(sp.date, i) === s) contSpecial.push({ ...sp, continuation: true, originDate: sp.date });
    }
  });
  if (directSpecial.length || contSpecial.length) return applyOverrides(s, settings, [...directSpecial, ...contSpecial]);
  const base = getBase(s, settings);
  const contRegular = [];
  for (let i = 1; i <= 2; i++) {
    const prev = addDays(s, -i);
    getBase(prev, settings).filter(sh => (sh.daysSpan || 1) > i).forEach(sh => {
      if (!contRegular.find(c => c.id === sh.id && c.originDate === prev)) {
        contRegular.push({ ...sh, continuation: true, originDate: prev });
      }
    });
  }
  return applyOverrides(s, settings, [...base, ...contRegular]);
};
const shortDate = (s) => { const d = parseDate(s); return `${d.getDate()}/${d.getMonth() + 1}`; };
const shiftDefOf = (s, shiftId, settings) => {
  const direct = shiftTypesFor(s, settings).find(x => x.id === shiftId);
  if (direct) return direct;
  // משמרת מיוחדת/רגילה שמתחילה ביום אחר (המשך) — חיפוש בהגדרות
  const special = (settings?.special || []).find(sp => sp.id === shiftId);
  return special || null;
};

/* ============ עיצוב ============ */
const INK = '#1C1A17';
const TEAL = '#41ABC3';
const TEAL_DARK = 'color-mix(in oklab, #41ABC3 70%, black)';
const TEAL_SOFT = 'color-mix(in oklab, #41ABC3 14%, white)';
const DOTS = {
  morning: 'oklch(0.78 0.13 80)', evening: 'oklch(0.62 0.12 250)',
  short: 'oklch(0.68 0.11 160)', night: 'oklch(0.45 0.09 290)',
};
const EXTRA_DOTS = ['oklch(0.62 0.14 25)', 'oklch(0.62 0.14 330)', 'oklch(0.62 0.14 130)'];
const dotOf = (id) => DOTS[id] || EXTRA_DOTS[Math.abs([...String(id)].reduce((a, c) => a + c.charCodeAt(0), 0)) % EXTRA_DOTS.length];
const MARK_STATUS = {
  un:   { bg: 'oklch(0.93 0.06 25)',  bd: '1.5px solid oklch(0.62 0.16 25)',  fg: 'oklch(0.42 0.16 25)' },
  high: { bg: 'oklch(0.94 0.06 155)', bd: '1.5px solid oklch(0.6 0.13 155)',  fg: 'oklch(0.4 0.12 155)' },
  can:  { bg: 'oklch(0.94 0.05 240)', bd: '1.5px solid oklch(0.6 0.12 240)',  fg: 'oklch(0.42 0.12 240)' },
  none: { bg: '#FFFFFF', bd: '1px solid #E7E4DF', fg: '#3A3631' },
};
// מזהה עובד להתחזות (אדמין בלבד) — מוגדר כ-URL param ?impersonate=<id>
const IMPERSONATE_ID = new URLSearchParams(window.location.search).get('impersonate') || null;

// Faded (implied) marks — dashed border, lighter fill, used in calendar for unmarked days
const MARK_STATUS_FADED = {
  un:  { bg: 'oklch(0.975 0.025 25)',  bd: '1px dashed oklch(0.8 0.1 25)',   fg: 'oklch(0.72 0.1 25)' },
  can: { bg: 'oklch(0.975 0.02 240)', bd: '1px dashed oklch(0.8 0.07 240)', fg: 'oklch(0.72 0.08 240)' },
};

const fmtSentAt = (iso) => {
  if (!iso) return null;
  const d = new Date(iso);
  const t = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const today = new Date();
  if (d.toDateString() === today.toDateString()) return `היום, ${t}`;
  return `${d.getDate()} ${HEB_MONTHS[d.getMonth()]}, ${t}`;
};

/* ============ פירוק סידור שפורסם לימי-תצוגה ============ */
function buildMonthDays(ym, pubRow, myId, empNames) {
  const settings = pubRow?.shift_settings || null;
  const schedule = pubRow?.schedule || {};
  const days = [];
  const n = daysInMonth(ym);
  for (let d = 1; d <= n; d++) {
    const ds = `${ym}-${pad(d)}`;
    const dow = weekdayOf(ds);
    const baseOrder = shiftTypesFor(ds, settings).map(x => x.id);
    const dayData = schedule[ds] || {};
    const ids = Object.keys(dayData).sort((a, b) => {
      const ia = baseOrder.indexOf(a), ib = baseOrder.indexOf(b);
      return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    });
    const shifts = ids.map(id => {
      const def = shiftDefOf(ds, id, settings);
      const people = dayData[id] || [];
      const special = !!(def && (def.date || (def.daysSpan || 1) > 1)) || !DOTS[id];
      // כשהמשבץ הגדיר לי שעות אישיות, הכרטיס מציג אותן ולא את שעות הבלוק
      const ownShift = def && people.includes(myId) && hasPersonTimes(def, myId);
      const own = ownShift ? personTimes(ds, def, myId) : null;
      return {
        id,
        label: def?.name || id,
        time: own ? `${fmtHM(own.start)}–${fmtHM(own.end)}` : (def ? `${def.start}–${def.end}` : ''),
        blockTime: def ? `${def.start}–${def.end}` : '',
        split: !!own,
        def,
        dot: dotOf(id),
        people,
        mine: people.includes(myId),
        special,
      };
    }).filter(sh => sh.people.length > 0);
    const mineShift = shifts.find(s => s.mine) || null;
    days.push({ num: d, ds, dow, dayName: HEB_DAYS[dow], shifts, mine: !!mineShift, holiday: hebrewHolidayOf(parseDate(ds)) });
  }
  return days;
}

// כל המשמרות שפורסמו, ממוינות לפי זמן התחלה — כדי למצוא את המשמרת שלפני ושאחרי, גם מעבר לחצות
function buildTimeline(published) {
  const out = [];
  Object.keys(published).forEach(ym => {
    const settings = published[ym]?.shift_settings || null;
    const schedule = published[ym]?.schedule || {};
    Object.keys(schedule).forEach(ds => {
      Object.keys(schedule[ds] || {}).forEach(sid => {
        const def = shiftDefOf(ds, sid, settings);
        if (!def) return;
        const t = shiftTimesOf(ds, def);
        out.push({ ym, ds, shiftId: sid, def, people: schedule[ds][sid] || [],
          startMs: t.start.getTime(), endMs: t.end.getTime() });
      });
    });
  });
  return out.sort((a, b) => a.startMs - b.startMs);
}

// מי חופף אליי בזמן, גם ממשמרת עם מזהה שונה שרצה באותן שעות (למשל "יום קצר" מול "יום ארוך") —
// לא רק מי שנמצא באותה משבצת שלי. seen מונע כפילות עם מי שכבר ברשימת האנשים של המשמרת שלי עצמה.
function overlapMates(timeline, ds, shiftId, myId) {
  const mine = timeline.find(t => t.ds === ds && t.shiftId === shiftId);
  if (!mine) return [];
  const out = [];
  const seen = new Set([myId, ...mine.people]);
  timeline.forEach(t => {
    if (t === mine) return;
    if (t.startMs >= mine.endMs || t.endMs <= mine.startMs) return; // אין חפיפה בזמן
    (t.people || []).forEach(id => {
      if (seen.has(id)) return;
      seen.add(id);
      out.push({ id, ds: t.ds, shiftId: t.shiftId, def: t.def });
    });
  });
  return out;
}

// המשמרת שבאמת נגמרת ממש לפניי, והמשמרת שבאמת מתחילה ממש אחריי — לא "השכנה ברשימה הממוינת
// לפי שעת התחלה", כי משמרת מקבילה (כמו "יום קצר" מול "יום ארוך", אותה שעת התחלה בדיוק) הייתה
// נבחרת בטעות כ״קודמת״ למרות שהיא בכלל לא נגמרת — היא רצה איתי במקביל.
function sequentialNeighbors(timeline, ds, shiftId) {
  const mine = timeline.find(t => t.ds === ds && t.shiftId === shiftId);
  if (!mine) return { prev: null, next: null };
  const before = timeline.filter(t => t !== mine && t.endMs <= mine.startMs).sort((a, b) => b.endMs - a.endMs);
  const after = timeline.filter(t => t !== mine && t.startMs >= mine.endMs).sort((a, b) => a.startMs - b.startMs);
  return { prev: before[0] || null, next: after[0] || null };
}

// זמינות עובד למשמרת לפי הבקשה שהגיש. ערך "YYYY-MM-DD" = יום שלם, "YYYY-MM-DD@shiftId" = משמרת.
function availOf(req, ds, shiftId) {
  if (!req) return null;
  const hit = (arr) => (arr || []).some(v => v === ds || v === ds + '@' + shiftId);
  if (hit(req.unavailable)) return 'unavailable';
  if (hit(req.high)) return 'high';
  if (hit(req.can)) return 'can';
  return null;
}

// בדיקת קריטריוני הגשה מול תוצאה סופית (unavailable/high/can), לא מול marks גולמי — כדי
// שהגמישות של מצב חסימות/זמינות לא תשפיע. אזהרה בלבד; שבוע חלקי בקצה הטווח שמבנית
// לא יכול לעמוד במינימום (פחות ימים מהדרוש) מדולג, כדי לא להתריע על משהו שאי אפשר לתקן.
function checkRequestCriteria(rangeDates, row, settings, criteria) {
  const violations = [];
  const weeks = {};
  rangeDates.forEach(ds => {
    const d = parseDate(ds);
    const sun = new Date(d); sun.setDate(d.getDate() - d.getDay());
    const key = dateStr(sun);
    (weeks[key] = weeks[key] || []).push(ds);
  });
  let anyFriday = false, anySaturday = false;
  Object.values(weeks).forEach(dates => {
    let nights = 0, days = 0;
    dates.forEach(ds => {
      const shifts = shiftTypesFor(ds, settings).filter(s => !s.continuation);
      const openShift = (s) => availOf(row, ds, s.id) !== 'unavailable';
      if (shifts.some(s => s.id === 'night') && openShift({ id: 'night' })) nights++;
      if (shifts.some(s => s.id !== 'night' && openShift(s))) days++;
      const wd = weekdayOf(ds);
      // "שישי פנוי" = שישי קצר/ארוך בלבד (לא שבת ארוכה). "שבת פנויה" = בוקר שבת בלבד (לא שבת ארוכה/מוצאי שבת)
      if (wd === 5 && shifts.some(s => (s.id === 'short' || s.id === 'morning') && openShift(s))) anyFriday = true;
      if (wd === 6 && shifts.some(s => s.id === 'morning' && openShift(s))) anySaturday = true;
    });
    const label = `${dates[0].slice(8)}–${dates[dates.length - 1].slice(8)}`;
    // שני החוסרים (לילות/ימים) של אותו שבוע — שורה אחת משותפת, לא שתי שורות עם אותה כותרת שבוע
    const weekIssues = [];
    if (dates.length >= criteria.minNightsPerWeek && nights < criteria.minNightsPerWeek)
      weekIssues.push(`${nights}/${criteria.minNightsPerWeek} לילות פנויים בלבד`);
    if (dates.length >= criteria.minDaysPerWeek && days < criteria.minDaysPerWeek)
      weekIssues.push(`${days}/${criteria.minDaysPerWeek} ימים פנויים בלבד`);
    if (weekIssues.length) violations.push(`שבוע ${label}: ${weekIssues.join(' · ')}`);
  });
  if (criteria.minFridaysCanPerMonth > 0 && !anyFriday) violations.push('לא סומן אף שישי קצר/ארוך שאפשר לעבוד בו');
  if (criteria.minSaturdaysCanPerMonth > 0 && !anySaturday) violations.push('לא סומן אף בוקר שבת שאפשר לעבוד בו');
  return violations;
}

// גרסת "כן/לא" של checkRequestCriteria, לכל סוג קריטריון בנפרד — משמשת לתצוגת ✓ חיה
// בדרופדאון "מה מצופה ממני" (מתעדכנת עם כל שינוי בבקשה, בלי חכות לשמירה בפועל)
function meetsRequestCriteria(rangeDates, row, settings, criteria) {
  const weeks = {};
  rangeDates.forEach(ds => {
    const d = parseDate(ds);
    const sun = new Date(d); sun.setDate(d.getDate() - d.getDay());
    const key = dateStr(sun);
    (weeks[key] = weeks[key] || []).push(ds);
  });
  let nightsOk = true, daysOk = true, anyFriday = false, anySaturday = false;
  Object.values(weeks).forEach(dates => {
    let nights = 0, days = 0;
    dates.forEach(ds => {
      const shifts = shiftTypesFor(ds, settings).filter(s => !s.continuation);
      const openShift = (s) => availOf(row, ds, s.id) !== 'unavailable';
      if (shifts.some(s => s.id === 'night') && openShift({ id: 'night' })) nights++;
      if (shifts.some(s => s.id !== 'night' && openShift(s))) days++;
      const wd = weekdayOf(ds);
      if (wd === 5 && shifts.some(s => (s.id === 'short' || s.id === 'morning') && openShift(s))) anyFriday = true;
      if (wd === 6 && shifts.some(s => s.id === 'morning' && openShift(s))) anySaturday = true;
    });
    if (dates.length >= criteria.minNightsPerWeek && nights < criteria.minNightsPerWeek) nightsOk = false;
    if (dates.length >= criteria.minDaysPerWeek && days < criteria.minDaysPerWeek) daysOk = false;
  });
  return {
    minNightsPerWeek: nightsOk,
    minDaysPerWeek: daysOk,
    minFridaysCanPerMonth: criteria.minFridaysCanPerMonth <= 0 || anyFriday,
    minSaturdaysCanPerMonth: criteria.minSaturdaysCanPerMonth <= 0 || anySaturday,
  };
}

// האישור יגיד את האמת: "יועבר מיד" מול "יישלח לאישור"
function swapOutcome(kind, settings) {
  const needPeer = kind === 'full' ? settings.peerApprovalFull : settings.peerApprovalPartial;
  const needMgr = kind === 'full' ? settings.managerApprovalFull : settings.managerApprovalPartial;

  return { immediate: false, note: needPeer ? 'לאישור העמית' : 'לאישור המשבץ' };
}

        <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
          <span style={{ fontSize: 13, fontWeight: 800 }}>אימייל</span>
          <input type="email" placeholder="dana@example.com" value={email} autoComplete="email"
            onChange={e => { setEmail(e.target.value); setErr(false); }}
            onKeyDown={e => { if (e.key === 'Enter' && mode === 'login') login(); }}
            style={{ ...inputStyle, direction: 'ltr', textAlign: 'right' }} />
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
          <span style={{ fontSize: 13, fontWeight: 800 }}>סיסמה</span>
          <input type="password" placeholder="••••••••" value={password}
            autoComplete={mode === 'login' ? 'current-password' : 'new-password'}
            onChange={e => { setPassword(e.target.value); setErr(false); }}
            onKeyDown={e => { if (e.key === 'Enter' && mode === 'login') login(); }}
            style={{ ...inputStyle, border: err ? '1.5px solid oklch(0.55 0.18 25)' : `1.5px solid ${INK}`,
              background: err ? 'oklch(0.98 0.01 25)' : '#FFF' }} />
          {err && <span style={{ fontSize: 13, fontWeight: 600, color: 'oklch(0.5 0.18 25)' }}>
            {mode === 'login' ? 'האימייל או הסיסמה שגויים. נסו שוב או אפסו סיסמה.' : 'יש למלא את כל השדות (לפחות 6 תווים לסיסמה).'}
          </span>}
        </div>

        {mode === 'login' ? (<>
          <div onClick={login} style={{ background: INK, color: '#FFF', borderRadius: 8, padding: '14px 0', textAlign: 'center', fontSize: 15, fontWeight: 800, cursor: 'pointer', marginTop: 8, opacity: busy ? 0.6 : 1 }}>
            {busy ? 'רק רגע…' : 'כניסה'}
          </div>
          <div onClick={reset} style={{ textAlign: 'center', fontSize: 14, fontWeight: 700, color: TEAL_DARK, cursor: 'pointer', textDecoration: 'underline', textUnderlineOffset: 3 }}>שכחתי סיסמה</div>
          {resetSent && (
            <div style={{ textAlign: 'center', fontSize: 13, fontWeight: 600, color: 'oklch(0.45 0.1 160)', background: 'oklch(0.96 0.03 160)', borderRadius: 8, padding: '10px 12px' }}>
              שלחנו קישור לאיפוס סיסמה לכתובת האימייל שלך ✓
            </div>
          )}
        </>) : (
          <div onClick={register} style={{ background: TEAL, color: '#FFF', borderRadius: 8, padding: '14px 0', textAlign: 'center', fontSize: 15, fontWeight: 800, cursor: 'pointer', marginTop: 8, opacity: busy ? 0.6 : 1 }}>
            {busy ? 'שולח…' : 'שליחת בקשת הצטרפות'}
          </div>
        )}
      </div>
    </div>
  );
}

/* ============ תפיסת משבצת עובד שהוגדרה מראש (בלי אימייל) ============ */
function ClaimSeatScreen({ candidates, onPick, onNotInList, onLogout }) {
  const [query, setQuery] = React.useState('');
  const [picked, setPicked] = React.useState(null);
  const [busy, setBusy] = React.useState(false);
  const [err, setErr] = React.useState(null);

  const filtered = candidates.filter(e => !query.trim() || (e.name || '').includes(query.trim()));

  const confirm = async () => {
    if (busy) return;
    setBusy(true); setErr(null);
    try {
      await onPick(picked.id);
    } catch (e) {
      setErr(e?.message || 'שגיאה — נסו שוב');
      setBusy(false);
      setPicked(null);
    }
  };

  if (picked) {
    return (
      <div style={{ flex: 1, padding: '76px 30px 44px', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 20, textAlign: 'center', animation: 'fadeIn 0.2s' }}>
        <div style={{ width: 58, height: 58, borderRadius: '50%', background: TEAL_SOFT, color: TEAL_DARK, display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 900, fontSize: 24 }}>
          {(picked.name || '?')[0]}
        </div>
        <div style={{ fontSize: 20, fontWeight: 900 }}>את/ה {picked.name}?</div>
        <div style={{ fontSize: 13.5, color: '#6B6760', lineHeight: 1.6, maxWidth: 280 }}>
          החשבון שלך יחובר לעובד הזה — כל ההגדרות שכבר נקבעו לו (מכסה, העדפות) יישמרו.
        </div>
        {err && <div style={{ fontSize: 13, fontWeight: 600, color: 'oklch(0.5 0.18 25)' }}>{err}</div>}
        <div style={{ display: 'flex', gap: 10, width: '100%', maxWidth: 300 }}>
          <div onClick={() => { setPicked(null); setErr(null); }} style={{ flex: 1, background: '#FFF', border: `1.5px solid ${INK}`, borderRadius: 10, padding: '13px 0', fontSize: 14, fontWeight: 800, cursor: 'pointer', color: INK }}>
            לא, זה לא אני
          </div>
          <div onClick={confirm} style={{ flex: 1, background: TEAL, color: '#FFF', borderRadius: 10, padding: '13px 0', fontSize: 14, fontWeight: 800, cursor: 'pointer', opacity: busy ? 0.6 : 1 }}>
            {busy ? 'רגע…' : 'כן, זה אני'}
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={{ flex: 1, padding: '76px 30px 44px', display: 'flex', flexDirection: 'column', gap: 16, overflowY: 'auto', animation: 'fadeIn 0.25s' }}>
      <div style={{ fontSize: 26, fontWeight: 900, lineHeight: 1.3 }}>מי <span style={{ color: TEAL }}>את/ה?</span></div>
      <div style={{ fontSize: 13.5, color: '#6B6760', lineHeight: 1.6 }}>
        המנהל כבר הגדיר אותך במערכת. בחר/י את השם שלך מהרשימה כדי להתחבר ישירות לפרטים שכבר נקבעו לך.
      </div>
      <input type="text" placeholder="חיפוש שם" value={query} onChange={e => setQuery(e.target.value)}
        style={{ border: `1.5px solid ${INK}`, borderRadius: 8, padding: '12px 14px', fontSize: 15, background: '#FFF', color: INK, width: '100%', fontFamily: 'inherit' }} />
      <div style={{ display: 'flex', flexDirection: 'column', gap: 6, maxHeight: 320, overflowY: 'auto' }}>
        {filtered.map(e => (
          <div key={e.id} onClick={() => setPicked(e)}
            style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '11px 14px', border: '1.5px solid #E7E4DF', borderRadius: 10, cursor: 'pointer', background: '#FFF' }}>
            <div style={{ width: 32, height: 32, borderRadius: '50%', background: TEAL_SOFT, color: TEAL_DARK, display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 800, fontSize: 13, flexShrink: 0 }}>
              {(e.name || '?')[0]}
            </div>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: 14, fontWeight: 700 }}>{e.name}</div>
              {e.role && <div style={{ fontSize: 11.5, color: '#8A867F' }}>{e.role}</div>}
            </div>
          </div>
        ))}
        {filtered.length === 0 && <div style={{ fontSize: 13, color: '#A09C94', textAlign: 'center', padding: '12px 0' }}>לא נמצא שם תואם</div>}
      </div>
      <div onClick={onNotInList} style={{ textAlign: 'center', fontSize: 13.5, fontWeight: 700, color: TEAL_DARK, cursor: 'pointer', textDecoration: 'underline', textUnderlineOffset: 3, marginTop: 4 }}>
        השם שלי לא ברשימה
      </div>
      <div onClick={onLogout} style={{ textAlign: 'center', fontSize: 12.5, color: '#A09C94', cursor: 'pointer', marginTop: 8 }}>התנתקות</div>
    </div>
  );
}

/* ============ קביעת סיסמה חדשה (לאחר קישור איפוס) ============ */
function NewPasswordScreen({ onDone }) {
  const [pw, setPw] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const [err, setErr] = React.useState(null);
  const save = async () => {
    if (pw.length < 6) { setErr('הסיסמה צריכה להכיל לפחות 6 תווים'); return; }
    setBusy(true);
    const { error } = await sb.auth.updateUser({ password: pw });
    setBusy(false);
    if (error) setErr(error.message); else onDone();
  };
  return (
    <div style={{ flex: 1, padding: '76px 30px', display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div style={{ fontSize: 26, fontWeight: 900 }}>בחירת סיסמה חדשה</div>
      <input type="password" placeholder="סיסמה חדשה" value={pw} onChange={e => { setPw(e.target.value); setErr(null); }}
        style={{ border: `1.5px solid ${INK}`, borderRadius: 8, padding: '13px 14px', fontSize: 15 }} />
      {err && <span style={{ fontSize: 13, fontWeight: 600, color: 'oklch(0.5 0.18 25)' }}>{err}</span>}
      <div onClick={save} style={{ background: INK, color: '#FFF', borderRadius: 8, padding: '14px 0', textAlign: 'center', fontSize: 15, fontWeight: 800, cursor: 'pointer', opacity: busy ? 0.6 : 1 }}>שמירה והמשך</div>
    </div>
  );
}

/* ============ האפליקציה הראשית ============ */
function App() {
  const [session, setSession] = React.useState(undefined);   // undefined=בטעינה, null=לא מחובר
  const [recovery, setRecovery] = React.useState(false);
  const [me, setMe] = React.useState(null);                  // רשומת העובד מ-app_employees
  const [meStatus, setMeStatus] = React.useState('loading'); // loading | ok | notfound | error | pending | claim
  // "claim": יש עובדים שהוגדרו מראש ללא אימייל (מסך "עובדים ובקשות" אצל המשבץ) —
  // מציעים למשתמש שהתחבר לתפוס אחד מהם לפני שממשיכים לבדיקת pending/הרשמה רגילה
  const [claimCandidates, setClaimCandidates] = React.useState([]);
  const [claimEmail, setClaimEmail] = React.useState('');
  const [claimSessionUser, setClaimSessionUser] = React.useState(null);
  const [published, setPublished] = React.useState({});      // { 'YYYY-MM': row }
  const [globalSettings, setGlobalSettings] = React.useState(null); // הגדרות משמרות עדכניות מהמשבץ
  const [anthropicKey, setAnthropicKey] = React.useState('');      // מפתח Anthropic — נטען מ-Supabase
  const [serverReqs, setServerReqs] = React.useState({});    // { 'YYYY-MM': row } — הבקשות שלי מהשרת
  // { 'YYYY-MM': { marks, note, dirty } } — נטען מ-localStorage כדי ששינויים שלא נשלחו (עדיין)
  // לא ייעלמו ברענון/סגירה בטעות; ראו אפקט השמירה החוזרת בהמשך
  const [localReqs, setLocalReqs] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('mishmarot-draft-requests')) || {}; } catch { return {}; }
  });
  const [allReqs, setAllReqs] = React.useState({});          // { 'YYYY-MM': { emp_id: row } } — כל העובדים
  const [swaps, setSwaps] = React.useState([]);               // כל בקשות החילוף (shift_swap_requests)
  const [mgrEmps, setMgrEmps] = React.useState([]);          // כרטיסי העובדים מהמשבץ (max, no_weekday_nights ממוזג מ-employee_prefs)
  const [swapSettings, setSwapSettings] = React.useState(DEFAULT_SWAP_SETTINGS);
  const [recurring, setRecurring] = React.useState([]);       // בקשות קבועות (employee_recurring_requests)
  const [criteria, setCriteria] = React.useState(DEFAULT_REQUEST_CRITERIA);
  const [myPrefs, setMyPrefs] = React.useState(null);          // employee_prefs שלי — יעד משמרות/שבוע, שישי/שבת
  const [detail, setDetail] = React.useState(null);          // { ym, ds, shiftId } — מסך פרטי משמרת
  const [recurringOpen, setRecurringOpen] = React.useState(false); // מסך ניהול בקשות קבועות
  const [tab, setTab] = React.useState('home');
  const [toast, setToast] = React.useState(null);

  const TM = thisMonth();

  // שומר את השינויים הלא-שמורים ל-localStorage בכל עדכון, כדי שרענון/סגירה בטעות
  // (או חוסר קליטה) לא ימחקו סימונים שעוד לא נשלחו למשבץ בפועל
  React.useEffect(() => {
    try { localStorage.setItem('mishmarot-draft-requests', JSON.stringify(localReqs)); } catch {}
  }, [localReqs]);

  /* --- session --- */
  React.useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session ?? null));
    const { data: sub } = sb.auth.onAuthStateChange((event, s) => {
      if (event === 'PASSWORD_RECOVERY') setRecovery(true);
      setSession(s ?? null);
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3500); };
  const refreshSwaps = React.useCallback(() => {
    sb.from('shift_swap_requests').select('*').order('created_at', { ascending: false })
      .then(({ data }) => setSwaps(data || [])).catch(() => {});
  }, []);
  const refreshRecurring = React.useCallback(() => {
    if (!me?.id) return;
    sb.from('employee_recurring_requests').select('*').eq('emp_id', me.id).order('weekday', { ascending: true })
      .then(({ data }) => setRecurring(data || [])).catch(() => {});
  }, [me?.id]);
  // עדכון העדפות שלי (employee_prefs) — דו-כיווני עם אפליקציית המשבץ
  const saveMyPref = React.useCallback((patch) => {
    if (!me?.id) return;
    setMyPrefs(p => ({ ...p, ...patch }));
    sb.from('employee_prefs').upsert({ emp_id: me.id, ...patch, updated_at: new Date().toISOString() }).then(() => {}).catch(() => {});
  }, [me?.id]);

  // ממשיך את הטיפול הרגיל ב"לא נמצא" — בדיקת pending_employees, ורישום אוטומטי
  // כממתין למשתמשי Google. נקרא גם מ-loadAll ישירות (אין משבצות פנויות לתפוס)
  // וגם מ-ClaimSeatScreen כשהמשתמש לוחץ "השם שלי לא ברשימה".
  const resolveNotFound = React.useCallback(async (lookupEmail, sessionUser) => {
    // בדיקה ב-pending_employees
    const { data: pending } = await sb.from('pending_employees').select('id,status').eq('email', lookupEmail).maybeSingle();
    if (pending) {
      setMeStatus(pending.status === 'pending' ? 'pending' : 'notfound');
      return;
    }
    // משתמש Google שאינו ברשימה — רישום אוטומטי כממתין
    const provider = sessionUser?.app_metadata?.provider;
    if (provider === 'google' || sessionUser?.identities?.some(i => i.provider === 'google')) {
      const googleName = sessionUser?.user_metadata?.full_name || sessionUser?.user_metadata?.name || '';
      await sb.from('pending_employees').upsert({ email: lookupEmail, name: googleName }, { onConflict: 'email' });
      setMeStatus('pending');
      return;
    }
    setMeStatus('notfound');
  }, []);

  /* --- טעינת נתונים --- */
  // byId=true → identifier הוא emp.id; byId=false (ברירת מחדל) → identifier הוא email
  const loadAll = React.useCallback(async (identifier, byId = false, sessionUser = null) => {
    try {
      const { data: emps, error: e1 } = await sb.from('app_employees').select('*');
      if (e1) throw e1;
      const mine = byId
        ? (emps || []).find(x => x.id === identifier)
        : (emps || []).find(x => (x.email || '').trim().toLowerCase() === identifier.trim().toLowerCase());
      if (!mine) {
        if (!byId) {
          const lookupEmail = identifier.trim().toLowerCase();
          // משבצות עובדים שהוגדרו מראש בלי אימייל — מציעים לתפוס אחת לפני
          // שממשיכים לבדיקת pending/הרשמה אוטומטית
          const unclaimed = (emps || []).filter(e => !e.email);
          if (unclaimed.length > 0) {
            setClaimCandidates(unclaimed);
            setClaimEmail(lookupEmail);
            setClaimSessionUser(sessionUser);
            setMeStatus('claim');
            return;
          }
          await resolveNotFound(lookupEmail, sessionUser);
          return;
        }
        setMeStatus('notfound');
        return;
      }
      setMe({ ...mine, allEmployees: emps });
      setMeStatus('ok');

      const [{ data: pubs, error: e2 }, { data: reqs, error: e3 }, settingsRes, { data: swapRows }, { data: recurRows }, { data: prefRow }, { data: allPrefRows }] = await Promise.all([
        sb.from('published_schedules').select('*'),
        sb.from('employee_requests').select('*'),
        sb.from('mishmarot_state').select('data').eq('id', 'main').maybeSingle(),
        sb.from('shift_swap_requests').select('*').order('created_at', { ascending: false }),
        sb.from('employee_recurring_requests').select('*').eq('emp_id', mine.id).order('weekday', { ascending: true }),
        sb.from('employee_prefs').select('*').eq('emp_id', mine.id).maybeSingle(),
        sb.from('employee_prefs').select('emp_id,no_weekday_nights'),
      ]);
      if (e2) throw e2;
      if (e3) throw e3;
      setSwaps(swapRows || []);
      setRecurring(recurRows || []);
      setMyPrefs(prefRow || { weekday_shifts_per_week: 2, no_weekday_nights: false, wants_friday_short: true, wants_friday_long: true, wants_shabbat_long: true, wants_saturday_short: true });
      // הגדרות המשמרות + מפתח Anthropic (נשמר ע"י המשבץ)
      const stateData = settingsRes?.data?.data || {};
      setGlobalSettings(stateData.shiftSettings || null);
      // ממזג "ללא משמרות לילה" מ-employee_prefs (של כל עובד, לא רק שלי) לתוך רשימת
      // העובדים מהמשבץ — נדרש כדי לסנן מועמדים למשמרת לילה במסך חילופי משמרות
      const noNightsById = {};
      (allPrefRows || []).forEach(r => { noNightsById[r.emp_id] = !!r.no_weekday_nights; });
      setMgrEmps((stateData.employees || []).map(e => ({ ...e, no_weekday_nights: noNightsById[e.id] || false })));
      setSwapSettings(s => ({ ...s, ...(stateData.swapSettings || {}) }));
      setCriteria(c => ({ ...c, ...(stateData.requestCriteria || {}) }));
      setAnthropicKey(prev => prev || stateData.anthropicKey || '');
      // PWA: auto-subscribe only if user hasn't explicitly opted out
      if (stateData.vapidPublicKey && mine.id && window.subscribeToPush
          && !localStorage.getItem('push-opted-out')) {
        window.subscribeToPush(mine.id, stateData.vapidPublicKey).catch(() => {});
      }
      const pubMap = {};
      (pubs || []).forEach(r => { pubMap[r.month] = r; });
      setPublished(pubMap);
      const reqMap = {};
      (reqs || []).filter(r => r.emp_id === mine.id).forEach(r => { reqMap[r.month] = r; });
      setServerReqs(reqMap);
      // בקשות כל העובדים — משמשות במסך המשמרת לאיתור מחליף פוטנציאלי
      const allMap = {};
      (reqs || []).forEach(r => { (allMap[r.month] = allMap[r.month] || {})[r.emp_id] = r; });
      setAllReqs(allMap);
      // אתחול עריכות מקומיות מהשרת — בלי לדרוס שינויים שטרם נשלחו.
      // ערך "YYYY-MM-DD" = יום שלם (marks[day] מחרוזת), "YYYY-MM-DD@shiftId" = משמרת (marks[day] אובייקט)
      setLocalReqs(prev => {
        const next = { ...prev };
        Object.entries(reqMap).forEach(([m, r]) => {
          if (next[m]?.dirty) return;
          const marks = {};
          [['unavailable', 'un'], ['high', 'high'], ['can', 'can']].forEach(([key, mark]) => {
            (r[key] || []).forEach(entry => {
              const at = entry.indexOf('@');
              const ds = at === -1 ? entry : entry.slice(0, at);
              const sid = at === -1 ? null : entry.slice(at + 1);
              if (!ds) return;
              if (sid) {
                if (typeof marks[ds] !== 'object' || !marks[ds]) marks[ds] = {};
                marks[ds][sid] = mark;
              } else {
                marks[ds] = mark;
              }
            });
          });
          next[m] = { marks, note: r.note || '', mgrNote: r.manager_note || '', dirty: false };
        });
        return next;
      });
    } catch (err) {
      console.error(err);
      setMeStatus('error');
    }
  }, []);

  // מצב התחזות: טעינה לפי emp_id במקום email
  React.useEffect(() => {
    if (!IMPERSONATE_ID) return;
    setMeStatus('loading');
    loadAll(IMPERSONATE_ID, true);
  }, [loadAll]);

  React.useEffect(() => {
    if (IMPERSONATE_ID || !session?.user?.email) return;
    setMeStatus('loading');
    loadAll(session.user.email, false, session.user);
  }, [session?.user?.email, loadAll]);

  // רענון כשהאפליקציה חוזרת לפוקוס (סידור חדש פורסם וכו')
  React.useEffect(() => {
    const onVis = () => {
      if (!IMPERSONATE_ID && document.visibilityState === 'visible' && session?.user?.email && meStatus === 'ok')
        loadAll(session?.user?.email, false, session?.user);
    };
    document.addEventListener('visibilitychange', onVis);
    return () => document.removeEventListener('visibilitychange', onVis);
  }, [session, meStatus, loadAll]);

  const logout = async () => { await sb.auth.signOut(); setMe(null); setMeStatus('loading'); setTab('home'); };

  // תפיסת משבצת עובד שהוגדרה מראש: מחברים את האימייל שהתחברת איתו לרשומה הקיימת
  // (רק אם עדיין לא נתפסה בינתיים ע"י מישהו אחר), ואז טוענים הכל מחדש כרגיל
  const claimSeat = async (empId) => {
    const { data, error } = await sb.from('app_employees')
      .update({ email: claimEmail })
      .eq('id', empId)
      .is('email', null)
      .select();
    if (error) throw error;
    if (!data || !data.length) throw new Error('התפוס — מישהו כבר בחר את השם הזה');
    // ניקוי שאריות אם בינתיים גם נוצרה רשומת "ממתין לאישור" עבור האימייל הזה
    try { await sb.from('pending_employees').delete().eq('email', claimEmail); } catch (_) {}
    await loadAll(claimEmail, false, claimSessionUser);
  };
  const claimNotInList = () => resolveNotFound(claimEmail, claimSessionUser);

  // Sync notif prefs to IDB on first load so SW can read them during periodic sync
  React.useEffect(() => {
    const PREFS_KEY = 'mishmarot-notif-prefs';
    let prefs;
    try { prefs = JSON.parse(localStorage.getItem(PREFS_KEY)); } catch {}
    idbSet('notifPrefs', prefs || { alert24h: true, alertCustom: false, alertCustomHours: 2 }).catch(() => {});
  }, []);

  /* --- מסכי קצה --- */
  const frame = (children) => (
    <div className="app-vh" style={{ background: '#E9E7E2', display: 'flex', justifyContent: 'center' }}>
      <div className="app-vh" style={{ width: '100%', maxWidth: 430, background: '#FFFFFF', display: 'flex', flexDirection: 'column', position: 'relative',
        boxShadow: '0 0 0 1px #DCD9D3, 0 24px 60px rgba(30,28,24,0.12)', overflow: 'hidden' }}>
        {children}
        {toast && (
          <div style={{ position: 'fixed', bottom: 'calc(124px + env(safe-area-inset-bottom))', left: '50%', transform: 'translateX(-50%)', background: INK, color: '#FFF', borderRadius: 10,
            padding: '10px 18px', fontSize: 13, fontWeight: 700, zIndex: 100, animation: 'popIn 0.2s', maxWidth: 340, textAlign: 'center' }}>{toast}</div>
        )}
      </div>
    </div>
  );

  if (session === undefined && !IMPERSONATE_ID) {
    return frame(<div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Spinner /></div>);
  }
  if (recovery && session) {
    return frame(<NewPasswordScreen onDone={() => { setRecovery(false); showToast('הסיסמה עודכנה ✓'); }} />);
  }
  if (!session && !IMPERSONATE_ID) return frame(<LoginScreen />);

  if (meStatus === 'loading') {
    return frame(<div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 14 }}>
      <Spinner /><span style={{ fontSize: 13, color: '#8A867F' }}>טוען את הנתונים{IMPERSONATE_ID ? ' לאדמין' : ' שלך'}…</span>
    </div>);
  }
  if (meStatus === 'notfound' || meStatus === 'error') {
    return frame(
      <div style={{ flex: 1, padding: '76px 30px', display: 'flex', flexDirection: 'column', gap: 14, textAlign: 'center', alignItems: 'center', justifyContent: 'center' }}>
        <div style={{ width: 58, height: 58, borderRadius: 14, background: '#F1EFEB', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 26, fontWeight: 900, color: '#A09C94' }}>!</div>
        {meStatus === 'notfound' && !IMPERSONATE_ID ? (<>
          <div style={{ fontSize: 17, fontWeight: 800 }}>החשבון לא משויך לעובד</div>
          <div style={{ fontSize: 14, color: '#6B6760', lineHeight: 1.6 }}>
            התחברת בתור <b style={{ direction: 'ltr', unicodeBidi: 'embed' }}>{session?.user?.email}</b>, אבל הכתובת הזו לא מופיעה אצל אף עובד במערכת.<br />
            בקשו מהמנהל להזין את האימייל הזה בכרטיס העובד שלכם (מסך עובדים ← עריכה).
          </div>
        </>) : (<>
          <div style={{ fontSize: 17, fontWeight: 800 }}>{IMPERSONATE_ID ? 'עובד לא נמצא' : 'לא הצלחנו לטעון את הנתונים'}</div>
          <div style={{ fontSize: 14, color: '#6B6760', lineHeight: 1.6 }}>
            {IMPERSONATE_ID ? `עובד עם מזהה "${IMPERSONATE_ID}" לא קיים במערכת.` : 'ייתכן שהמערכת עדיין לא הוקמה (טבלאות Supabase חסרות) או שיש בעיית רשת. נסו שוב מאוחר יותר.'}
          </div>
        </>)}
        <div style={{ display: 'flex', gap: 10, marginTop: 8 }}>
          {IMPERSONATE_ID
            ? <div onClick={() => window.close()} style={{ background: INK, color: '#FFF', borderRadius: 8, padding: '11px 20px', fontSize: 14, fontWeight: 800, cursor: 'pointer' }}>סגור</div>
            : (<>
              <div onClick={() => loadAll(session?.user?.email)} style={{ background: INK, color: '#FFF', borderRadius: 8, padding: '11px 20px', fontSize: 14, fontWeight: 800, cursor: 'pointer' }}>נסו שוב</div>
              <div onClick={logout} style={{ background: '#FFF', border: `1.5px solid ${INK}`, borderRadius: 8, padding: '11px 20px', fontSize: 14, fontWeight: 800, cursor: 'pointer' }}>התנתקות</div>
            </>)
          }
        </div>
      </div>
    );
  }

  if (meStatus === 'claim') {
    return frame(
      <ClaimSeatScreen candidates={claimCandidates} onPick={claimSeat} onNotInList={claimNotInList} onLogout={logout} />
    );
  }

  if (meStatus === 'pending') {
    return frame(
      <div style={{ flex: 1, padding: '60px 28px', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 20, textAlign: 'center' }}>
        <div style={{ fontSize: 52 }}>⏳</div>
        <div style={{ fontSize: 19, fontWeight: 800 }}>הבקשה נשלחה!</div>
        <div style={{ fontSize: 14, color: '#6B6760', lineHeight: 1.7, maxWidth: 280 }}>
          בקשת ההצטרפות שלך התקבלה.<br />
          המנהל יאשר אותה בקרוב — לאחר האישור תוכל להיכנס לאפליקציה.
        </div>
        <div onClick={logout} style={{ background: '#FFF', border: `1.5px solid ${INK}`, borderRadius: 10, padding: '12px 24px', fontSize: 14, fontWeight: 800, cursor: 'pointer', color: INK }}>התנתקות</div>
      </div>
    );
  }

  /* --- נתונים מחושבים --- */
  const empNames = {};
  (me.allEmployees || []).forEach(e => { empNames[e.id] = e.name; });
  Object.values(published).forEach(p => (p.employees || []).forEach(e => { if (!empNames[e.id]) empNames[e.id] = e.name; }));

  const firstName = (me.name || '').split(' ')[0];
  const emailForOps = IMPERSONATE_ID ? 'admin' : (session?.user?.email || '');

  return frame(<>
    {IMPERSONATE_ID && (
      <div style={{ background: 'oklch(0.5 0.18 25)', color: '#FFF', padding: '8px 16px', fontSize: 12.5, fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>
        <span>🔑 מצב אדמין · צופה בתור {me.name}</span>
        <span onClick={() => window.close()} style={{ cursor: 'pointer', fontSize: 18, fontWeight: 900, lineHeight: 1, opacity: 0.85 }}>×</span>
      </div>
    )}
    {detail ? (
      <ShiftDetail me={me} empNames={empNames} published={published} allReqs={allReqs} mgrEmps={mgrEmps}
        ctx={detail} onClose={() => setDetail(null)} showToast={showToast} onSwapsChanged={refreshSwaps} swapSettings={swapSettings} />
    ) : recurringOpen ? (
      <RecurringRequestsScreen me={me} TM={TM} globalSettings={globalSettings} recurring={recurring}
        onClose={() => setRecurringOpen(false)} onChanged={refreshRecurring} showToast={showToast} />
    ) : (
    <Shell me={me} tab={tab} setTab={setTab} swapBadge={swaps.filter(r => r.status === 'pending_peer' && r.to_emp_id === me.id).length}>
      {tab === 'home' && <HomeTab me={me} empNames={empNames} published={published} TM={TM} swaps={swaps} goSched={() => setTab('schedule')} goReq={() => setTab('requests')} goSwaps={() => setTab('swaps')}
        onOpenShift={(ym, ds, shiftId) => setDetail({ ym, ds, shiftId })} />}
      {tab === 'schedule' && <ScheduleTab me={me} empNames={empNames} published={published} TM={TM} serverReqs={serverReqs} goReq={() => setTab('requests')}
        onOpenShift={(ym, ds, shiftId) => setDetail({ ym, ds, shiftId })} />}
      {tab === 'requests' && <RequestsTab me={me} email={emailForOps} published={published} TM={TM} globalSettings={globalSettings}
        serverReqs={serverReqs} setServerReqs={setServerReqs} localReqs={localReqs} setLocalReqs={setLocalReqs} showToast={showToast} anthropicKey={anthropicKey}
        recurring={recurring} criteria={criteria} mgrEmps={mgrEmps} myPrefs={myPrefs} goRecurring={() => setRecurringOpen(true)} />}
      {tab === 'swaps' && <SwapsTab me={me} empNames={empNames} published={published} swaps={swaps} onRefresh={refreshSwaps} showToast={showToast} swapSettings={swapSettings} />}
      {tab === 'settings' && <SettingsTab me={me} email={emailForOps} onLogout={IMPERSONATE_ID ? () => window.close() : logout} myPrefs={myPrefs} onSavePref={saveMyPref} />}
    </Shell>
    )}
  </>);
}

        env(safe-area-inset-bottom) מרים אותו מעל פס המחוות בבתי אייפון עם notch/Home indicator */}

/* ============ מסך הגדרות ============ */
function PrefRow({ label, sub, value, onChange, disabled }) {
  return (
    <div style={{ padding: '13px 16px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, opacity: disabled ? 0.45 : 1 }}>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 13.5, fontWeight: 600 }}>{label}</div>
        {sub && <div style={{ fontSize: 11.5, color: '#8A867F', marginTop: 2 }}>{sub}</div>}
      </div>
      <label style={{ position: 'relative', display: 'inline-block', width: 44, height: 26, flexShrink: 0 }}>
        <input type="checkbox" checked={!!value} onChange={e => !disabled && onChange(e.target.checked)}
          style={{ opacity: 0, width: 0, height: 0, position: 'absolute' }} />
        <span style={{ position: 'absolute', inset: 0, borderRadius: 13, background: value ? TEAL : '#D0CEC9', transition: 'background 0.2s', cursor: disabled ? 'default' : 'pointer', direction: 'ltr' }}>
          <span style={{ position: 'absolute', top: 4, left: value ? 22 : 4, width: 18, height: 18, borderRadius: '50%', background: '#FFF', transition: 'left 0.2s', boxShadow: '0 1px 4px rgba(0,0,0,0.2)' }} />
        </span>
      </label>
    </div>
  );
}

function SettingsTab({ me, email, onLogout, myPrefs, onSavePref }) {
  const PREFS_KEY = 'mishmarot-notif-prefs';
  const [prefs, setPrefs] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem(PREFS_KEY)) || { alert24h: true, alertCustom: false, alertCustomHours: 2 }; }
    catch { return { alert24h: true, alertCustom: false, alertCustomHours: 2 }; }
  });
  const [notifPerm, setNotifPerm] = React.useState(() =>
    typeof Notification !== 'undefined' ? Notification.permission : 'unsupported'
  );
  // null = checking, true = subscribed, false = not subscribed
  const [pushSubscribed, setPushSubscribed] = React.useState(null);
  const [pushBusy, setPushBusy] = React.useState(false);
  const [pushError, setPushError] = React.useState(null);
  const [calToken, setCalToken] = React.useState(null);
  const [calBusy, setCalBusy] = React.useState(false);
  const [calCopied, setCalCopied] = React.useState(false);
  const [calError, setCalError] = React.useState(null);
  const firstName = (me.name || '').split(' ')[0];

  const calUrl = calToken ? `${SB_URL}/functions/v1/calendar?token=${calToken}` : null;

  React.useEffect(() => {
    if (!me?.id) return;
    sb.from('app_employees').select('cal_token').eq('id', me.id).maybeSingle()
      .then(({ data }) => { if (data?.cal_token) setCalToken(data.cal_token); })
      .catch(() => {});
  }, [me?.id]);

  // אסימון אקראי חדש. יצירה מחדש מנתקת את הכתובת הקודמת, ולכן משמשת גם כאיפוס.
  const makeCalToken = async () => {
    setCalBusy(true); setCalError(null);
    try {
      const bytes = new Uint8Array(24);
      crypto.getRandomValues(bytes);
      const token = [...bytes].map(b => b.toString(16).padStart(2, '0')).join('');
      const { error } = await sb.from('app_employees').update({ cal_token: token }).eq('id', me.id);
      if (error) throw error;
      setCalToken(token);
      setCalCopied(false);
    } catch (e) {
      setCalError('לא הצלחנו ליצור כתובת: ' + (e?.message || String(e)));
    }
    setCalBusy(false);
  };

  const copyCalUrl = async () => {
    try { await navigator.clipboard.writeText(calUrl); }
    catch { setCalError('ההעתקה נחסמה — סמנו את הכתובת והעתיקו ידנית.'); return; }
    setCalCopied(true);
    setTimeout(() => setCalCopied(false), 2000);
  };

  // Check if already subscribed on mount
  React.useEffect(() => {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) { setPushSubscribed(false); return; }
    navigator.serviceWorker.ready.then(reg =>
      reg.pushManager.getSubscription().then(sub => setPushSubscribed(!!sub))
    ).catch(() => setPushSubscribed(false));
  }, []);

  const updatePrefs = (patch) => {
    const next = { ...prefs, ...patch };
    setPrefs(next);
    try { localStorage.setItem(PREFS_KEY, JSON.stringify(next)); } catch {}
    idbSet('notifPrefs', next).catch(() => {});
    // Sync to Supabase so the server-side shift-reminders function knows the alert settings
    if (me?.id) {
      sb.from('push_subscriptions').update({ prefs: next }).eq('emp_id', me.id).then(() => {}, () => {});
    }
  };

  const enablePush = async () => {
    setPushBusy(true);
    setPushError(null);
    try {
      // 1. Request permission if not yet granted
      let perm = notifPerm;
      if (perm !== 'granted') {
        perm = await Notification.requestPermission();
        setNotifPerm(perm);
      }
      if (perm !== 'granted') {
        setPushError('יש לאשר הרשאת התראות בדפדפן');
        setPushBusy(false); return;
      }
      // 2. Get VAPID public key from Supabase
      const { data: stateRow } = await sb.from('mishmarot_state').select('data').eq('id', 'main').maybeSingle();
      const vapidKey = stateRow?.data?.vapidPublicKey || null;
      if (!vapidKey) {
        setPushError('מפתח push לא הוגדר — בקשו מהמנהל להפעיל התראות פוש בהגדרות');
        setPushBusy(false); return;
      }
      // 3. Subscribe
      if (!window.subscribeToPush) {
        setPushError('Service Worker לא נטען — נסו לרענן את הדף');
        setPushBusy(false); return;
      }
      const ok = await window.subscribeToPush(me.id, vapidKey);
      if (ok) {
        localStorage.removeItem('push-opted-out');
        setPushSubscribed(true);
      } else {
        setPushError('ההרשמה להתראות נכשלה — נסו שוב');
      }
    } catch (e) {
      console.warn('enablePush error', e);
      setPushError('שגיאה: ' + (e?.message || String(e)));
    }
    setPushBusy(false);
  };

  const disablePush = async () => {
    setPushBusy(true);
    setPushError(null);
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if (sub) await sub.unsubscribe();
      await sb.from('push_subscriptions').delete().eq('emp_id', me.id);
      localStorage.setItem('push-opted-out', '1');
      setPushSubscribed(false);
    } catch (e) {
      console.warn('disablePush error', e);
      setPushError('שגיאה בביטול ההתראות: ' + (e?.message || String(e)));
    }
    setPushBusy(false);
  };


  const [testCountdown, setTestCountdown] = React.useState(null);

  const runTestPush = () => {
    if (testCountdown !== null) return;
    setTestCountdown(10);
    let n = 10;
    const iv = setInterval(() => {
      n--;
      if (n <= 0) {
        clearInterval(iv);
        setTestCountdown(null);
        navigator.serviceWorker.ready.then(reg =>
          reg.showNotification('🧪 בדיקת התראה', {
            body: 'אם אתה רואה את זה — ההתראות עובדות!',
            icon: './icon.svg',
            badge: './icon.svg',
            tag: 'test-push-' + Date.now(),
          })
        ).catch(e => console.warn('test push failed', e));
      } else {
        setTestCountdown(n);
      }
    }, 1000);
  };

  const sectionStyle = { background: '#FFF', borderRadius: 14, overflow: 'hidden', border: '1.5px solid #E8E5E0' };
  const divider = { borderTop: '1px solid #EFEDE9' };
  const pushEnabled = notifPerm === 'granted' && pushSubscribed === true;

  return (
    <div style={{ padding: '20px 16px 32px', display: 'flex', flexDirection: 'column', gap: 20 }}>

      {/* Profile card */}
      <div style={{ ...sectionStyle, padding: '16px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
          <div style={{ width: 50, height: 50, borderRadius: 13, background: TEAL_SOFT, color: TEAL_DARK, display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 900, fontSize: 22, flexShrink: 0 }}>
            {(firstName || '?')[0]}
          </div>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 16, fontWeight: 800 }}>{me.name}</div>
            <div style={{ fontSize: 11.5, color: '#8A867F', direction: 'ltr', textAlign: 'right', marginTop: 2, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{email}</div>
          </div>
        </div>
      </div>

              border: '1px solid #E7E4DF', borderRadius: 9, padding: '9px 10px', wordBreak: 'break-all', color: '#4A4640' }}>

                  padding: '10px 14px', fontSize: 13.5, fontWeight: 800, cursor: 'pointer', fontFamily: 'inherit', transition: 'background 0.3s' }}>

              מי שמחזיק בכתובת רואה את המשמרות שלך, אז אל תשתפו אותה. איפוס מנתק את הכתובת הישנה.
              יומן גוגל מרענן מנויים חיצוניים לאט — שינוי בסידור עשוי להופיע רק כעבור כמה שעות.

  return (
    <div style={{ flex: 1, minWidth: 0, background: '#FBFAF8', border: '1px solid #ECEAE5', borderRadius: 11, padding: '10px 12px', display: 'flex', flexDirection: 'column', gap: 6 }}>
      <div style={{ fontSize: 11, fontWeight: 800, color: '#8A867F', letterSpacing: '0.03em' }}>{title}</div>
      {item ? (<>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
          <span style={{ width: 7, height: 7, borderRadius: '50%', background: dotOf(item.shiftId), flexShrink: 0 }} />
          <span style={{ fontSize: 13, fontWeight: 800, color: INK }}>{item.def?.name || item.shiftId}</span>
          <span style={{ fontSize: 11.5, color: '#8A867F' }}>{item.def ? `${item.def.start}–${item.def.end}` : ''}</span>
        </div>
        <div style={{ fontSize: 11.5, color: '#8A867F' }}>{shortDate(item.ds)}</div>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5 }}>
          {item.people.length
            ? item.people.map(p => <PersonChip key={p} id={p} myId={myId} empNames={empNames} time={personTimeLabel(item.ds, item.def, p)} />)
            : <span style={{ fontSize: 12, color: '#A8A49C' }}>לא מאויש</span>}
        </div>
      </>) : <span style={{ fontSize: 12, color: '#A8A49C' }}>אין משמרת בסידור</span>}

  );
}

function ShiftDetail({ me, empNames, published, allReqs, mgrEmps, ctx, onClose, showToast, onSwapsChanged, swapSettings }) {
  const { ym, ds, shiftId } = ctx;
  const row = published[ym];
  const settings = row?.shift_settings || null;
  const def = shiftDefOf(ds, shiftId, settings);
  const daySchedule = row?.schedule?.[ds] || {};
  const people = daySchedule[shiftId] || [];
  const dow = weekdayOf(ds);
  const mySplit = def && hasPersonTimes(def, me.id);
  const myTimes = def ? personTimes(ds, def, me.id) : null;

  const timeline = React.useMemo(() => buildTimeline(published), [published]);
  const { prev, next } = sequentialNeighbors(timeline, ds, shiftId);
  // מי שנמצא איתי בפועל, כולל ממשמרת מקבילה עם מזהה אחר שרצה באותן שעות (למשל יום קצר מול יום ארוך)
  const overlapPeople = overlapMates(timeline, ds, shiftId, me.id);
  const mates = [...people.filter(p => p !== me.id), ...overlapPeople.map(o => o.id)];

  // מי שכבר עובד באותו יום מוסתר מרשימת המחליפים — הוא לא באמת פנוי
  const busyToday = new Set();
  Object.values(daySchedule).forEach(arr => (arr || []).forEach(id => busyToday.add(id)));

  const nightsOf = {};
  (mgrEmps || []).forEach(e => { nightsOf[e.id] = !e.no_weekday_nights; });
  const haveCaps = (mgrEmps || []).length > 0;

  // מחליפים אפשריים — אותו כלל שהמשבץ מפעיל: לא חסם, ואם הגיש רשימת "יכול" אז רק בתוכה
  const monthReqs = allReqs[ym] || {};
  const cands = [];
  // הרוסטר החי בלבד (app_employees). empNames מכיל גם עובדים מתמונות מצב של סידורים ישנים,
  // והם עדיין דרושים להצגת שמות — אבל לא כמועמדים להחלפה.
  (me.allEmployees || []).forEach(({ id }) => {
    if (id === me.id || busyToday.has(id)) return;
    if (shiftId === 'night' && haveCaps && !nightsOf[id]) return;
    const req = monthReqs[id];
    const av = availOf(req, ds, shiftId);
    if (av === 'unavailable') return;
    if ((req?.can || []).length > 0 && av !== 'can' && av !== 'high') return;
    cands.push({ id, av });
  });
  const rank = { high: 0, can: 1 };
  cands.sort((a, b) => (rank[a.av] ?? 2) - (rank[b.av] ?? 2)
    || (empNames[a.id] || '').localeCompare(empNames[b.id] || '', 'he'));

  const BADGE = {
    high: { text: 'ביקש.ה את המשמרת', ...MARK_STATUS.high },
    can:  { text: 'סימן.ה שיכול.ה',    ...MARK_STATUS.can },
  };
  const section = { fontSize: 12, fontWeight: 800, color: '#8A867F', letterSpacing: '0.04em' };

  const [actionOpen, setActionOpen] = React.useState(null);
  const [busy, setBusy] = React.useState(false);
  const [err, setErr] = React.useState(null);
  const [formTime, setFormTime] = React.useState('');
  const [formNote, setFormNote] = React.useState('');
  const [formCounterpart, setFormCounterpart] = React.useState(null);
  React.useEffect(() => { setFormTime(''); setFormNote(''); setFormCounterpart(null); setErr(null); }, [actionOpen]);

  const run = async (fn) => {
    setBusy(true); setErr(null);
    try { await fn(); setActionOpen(null); onSwapsChanged && onSwapsChanged(); showToast && showToast('הבקשה נשלחה ✓'); }
    catch (e) { setErr(e?.message || String(e)); }
    setBusy(false);
  };

  const proposeFull = (toEmpId) => run(() => callSwaps('create', {
    kind: 'full', source: 'direct', month: ym, date: ds, shiftId, fromEmpId: me.id, toEmpId,
  }));
  const postMarket = (kind, note) => run(() => callSwaps('create', {
    kind, source: 'market', month: ym, date: ds, shiftId, fromEmpId: me.id, note: note || '',
  }));
  const proposePartial = (direction, counterpartId, neighbor, time, note) => run(() => callSwaps('create', {
    kind: 'partial', source: 'direct', month: ym, date: ds, shiftId, fromEmpId: me.id,
    toEmpId: counterpartId, toDate: neighbor.ds, toShiftId: neighbor.shiftId,
    direction, edge: direction === 'early' ? 'start' : 'end', boundaryTime: time, note: note || '',
  }));
  const shortenHole = (edge, time, note) => run(() => callSwaps('create', {
    kind: 'hole', source: 'direct', month: ym, date: ds, shiftId, fromEmpId: me.id,
    edge, boundaryTime: time, note: note || '',
  }));

  // דיאלוג אישור לכל תרחיש, לפני שהפעולה יוצאת לדרך — הניסוח תלוי אם היא תתבצע
  // מיד או תישלח לאישור, לפי ה-toggles שהמשבץ הגדיר
  const [confirm, setConfirm] = React.useState(null);
  const shiftLabel = def?.name || shiftId;
  const swSettings = swapSettings || DEFAULT_SWAP_SETTINGS;

  const askProposeFull = (candId) => {
    const o = swapOutcome('full', swSettings);
    setConfirm({
      title: o.immediate ? 'מסירת המשמרת' : 'שליחת הצעה',
      body: o.immediate
        ? <>המשמרת <b>{shiftLabel}</b> ב-{shortDate(ds)} תועבר מיד ל<b>{empNames[candId] || candId}</b>. להמשיך?</>
        : <>הצעה למסור את <b>{shiftLabel}</b> ב-{shortDate(ds)} ל<b>{empNames[candId] || candId}</b> — הבקשה תישלח {o.note}. להמשיך?</>,
      confirmLabel: o.immediate ? 'כן, להעביר' : 'שליחת ההצעה',
      action: () => proposeFull(candId),
    });
  };
  const askPostMarket = (kind, note) => {
    const mgrNote = kind === 'full' && !swapOutcome('full', swSettings).immediate ? ' (בכפוף לאישור המשבץ אצל מי שיבחר לקחת אותה)' : '';
    setConfirm({
      title: 'פרסום בלוח',
      body: kind === 'full'
        ? <>המשמרת <b>{shiftLabel}</b> ב-{shortDate(ds)} תפורסם בלוח הפתוח לכל העובדים, וכל מי שירצה יוכל לקחת אותה{mgrNote}. להמשיך?</>
        : <>הכרזה שתפורסם בלוח: מעוניין.ת למסור חלק מ<b>{shiftLabel}</b> ב-{shortDate(ds)}. זו הכרזה בלבד, בלי השלמה אוטומטית. להמשיך?</>,
      confirmLabel: 'פרסום',
      action: () => postMarket(kind, note),
    });
  };
  const askProposePartial = (direction, counterpartId, neighbor, time, note) => {
    const o = swapOutcome('partial', swSettings);
    const verb = direction === 'early' ? 'ההתחלה' : 'הסיום';
    setConfirm({
      title: o.immediate ? 'שינוי שעות' : 'שליחת בקשה',
      body: o.immediate
        ? <>שעת {verb} שלך ב<b>{shiftLabel}</b> תשתנה ל-{time}, ושעות <b>{empNames[counterpartId] || counterpartId}</b> ישתנו בהתאם. להמשיך?</>
        : <>בקשה לשינוי שעות מול <b>{empNames[counterpartId] || counterpartId}</b> — הבקשה תישלח {o.note}. להמשיך?</>,
      confirmLabel: o.immediate ? 'כן, לעדכן' : 'שליחת הבקשה',
      action: () => proposePartial(direction, counterpartId, neighbor, time, note),
    });
  };
  const askShortenHole = (edge, time, note) => {
    setConfirm({
      title: 'קיצור בלי מחליף',
      body: <>המשמרת שלך תתקצר מיידית ל-{time}, בלי אישור מאף אחד — יישאר חור לא מאויש. להמשיך?</>,
      confirmLabel: 'כן, לקצר',
      danger: true,
      action: () => shortenHole(edge, time, note),
    });
  };
  const runConfirmed = async () => {
    if (!confirm) return;
    await run(confirm.action);
    setConfirm(null);
  };

  const actionBtn = (key, label) => (
    <button onClick={() => setActionOpen(cur => cur === key ? null : key)}
      style={{ background: actionOpen === key ? TEAL : '#FFF', color: actionOpen === key ? '#FFF' : INK,
        border: `1.5px solid ${actionOpen === key ? TEAL : '#E2DFD9'}`, borderRadius: 10, padding: '10px 12px',
        fontSize: 13, fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit', textAlign: 'right' }}>
      {label}
    </button>
  );

  return (<>
    <div style={{ flex: 1, overflowY: 'auto', animation: 'fadeIn 0.2s' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '14px 16px 6px' }}>
        <span onClick={onClose} style={{ fontSize: 22, fontWeight: 900, color: INK, cursor: 'pointer', lineHeight: 1, padding: '0 4px' }}>→</span>
        <span style={{ fontSize: 16, fontWeight: 900 }}>פרטי המשמרת</span>
      </div>

      <div style={{ padding: '10px 16px 28px', display: 'flex', flexDirection: 'column', gap: 18 }}>
        <div style={{ background: INK, color: '#FFF', borderRadius: 16, padding: 18, display: 'flex', flexDirection: 'column', gap: 9 }}>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, flexWrap: 'wrap' }}>
            <span style={{ width: 10, height: 10, borderRadius: '50%', background: dotOf(shiftId), flexShrink: 0 }} />
            <span style={{ fontSize: 28, fontWeight: 900, lineHeight: 1 }}>{def?.name || shiftId}</span>
            <span style={{ fontSize: 17, fontWeight: 700, color: 'rgba(255,255,255,0.85)', whiteSpace: 'nowrap', direction: 'ltr' }}>
              {myTimes ? `${fmtHM(myTimes.start)}–${fmtHM(myTimes.end)}` : (def ? `${def.start}–${def.end}` : '')}
            </span>
          </div>
          <div style={{ fontSize: 14, color: 'rgba(255,255,255,0.75)' }}>
            יום {HEB_DAYS[dow]}, {Number(ds.split('-')[2])} {inMonthLabel(ym)}
          </div>
          {mySplit && (
            <div style={{ fontSize: 12.5, color: 'rgba(255,255,255,0.6)', borderTop: '1px solid rgba(255,255,255,0.16)', paddingTop: 9 }}>

                    </button>

                )) : <div style={{ fontSize: 12.5, color: '#8A867F' }}>אין כרגע מי שפנוי.ה למשמרת הזו.</div>}

              <div style={{ display: 'flex', flexDirection: 'column', gap: 8, padding: '10px 12px', background: '#FBFAF8', border: '1px solid #ECEAE5', borderRadius: 10 }}>

                <button disabled={busy} onClick={() => askPostMarket('full', formNote)}

                </button>

              <div style={{ display: 'flex', flexDirection: 'column', gap: 8, padding: '10px 12px', background: '#FBFAF8', border: '1px solid #ECEAE5', borderRadius: 10 }}>
                <textarea value={formNote} onChange={e => setFormNote(e.target.value)} placeholder="איזה חלק? למשל: מעוניין.ת שמישהו יחליף אותי מ-19:00 ואילך"
                  rows={2} style={{ border: '1px solid #E2DFD9', borderRadius: 8, padding: '8px 10px', fontSize: 13, fontFamily: 'inherit', resize: 'vertical' }} />
                <div style={{ fontSize: 11.5, color: '#A8A49C', lineHeight: 1.5 }}>
                  זו הכרזה בלבד — אין כאן השלמה אוטומטית. מי שמעוניין.ת יצור.תיצור איתך קשר, ואז מעדכנים את השעות בפועל.
                </div>
                <button disabled={busy} onClick={() => askPostMarket('partial', formNote)}
                  style={{ background: TEAL, color: '#FFF', border: 'none', borderRadius: 8, padding: '9px 12px', fontSize: 13, fontWeight: 700, cursor: 'pointer' }}>
                  פרסום בלוח
                </button>
                {err && <div style={{ fontSize: 12, color: '#C05858' }}>{err}</div>}
              </div>

            {prev && prev.people.length > 0 && actionBtn('early', '⏪ הקדמתי — הגעתי לפני תחילת המשמרת')}
