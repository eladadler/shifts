name: Deploy Supabase functions

# פורס את פונקציית התזכורות ל-Supabase בכל שינוי שלה ב-main,
# כדי שלא יהיה צורך להדביק את הקוד ידנית בלוח הבקרה.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/shift-reminders/**'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # --no-verify-jwt: הקרון קורא לפונקציה עם מפתח publishable, שאינו JWT מדור קודם.
      # בלי זה הפריסה הייתה מחזירה את אימות ה-JWT וכל הרצה הייתה נכשלת ב-401.
      - name: Deploy shift-reminders
        run: supabase functions deploy shift-reminders --project-ref "$PROJECT_REF" --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ajniglpdgkwnasuslsyc
