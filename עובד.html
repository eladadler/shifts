              <div style={{ display: 'flex', flexDirection: 'column', gap: 8, padding: '10px 12px', background: '#FBFAF8', border: '1px solid #ECEAE5', borderRadius: 10 }}>
                <div style={{ fontSize: 12.5, color: '#6B6760' }}>ממי לקחת.י את הזמן, מ{prev.def?.name} של {shortDate(prev.ds)}?</div>
                <select value={formCounterpart || ''} onChange={e => setFormCounterpart(e.target.value)}
                  style={{ border: '1px solid #E2DFD9', borderRadius: 8, padding: '8px 10px', fontSize: 13, fontFamily: 'inherit' }}>
                  <option value="">בחרו עמית.ה</option>
                  {prev.people.map(id => <option key={id} value={id}>{empNames[id] || id}</option>)}
                </select>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <span style={{ fontSize: 12.5, color: '#6B6760' }}>התחלתי בפועל בשעה</span>
                  <input type="time" value={formTime} onChange={e => setFormTime(e.target.value)}
                    style={{ border: '1px solid #E2DFD9', borderRadius: 8, padding: '7px 9px', fontSize: 13, fontFamily: 'inherit' }} />
                </div>
                <button disabled={busy || !formCounterpart || !formTime}
                  onClick={() => askProposePartial('early', formCounterpart, prev, formTime, formNote)}
                  style={{ background: TEAL, color: '#FFF', border: 'none', borderRadius: 8, padding: '9px 12px', fontSize: 13, fontWeight: 700, cursor: 'pointer', opacity: (!formCounterpart || !formTime) ? 0.5 : 1 }}>
                  שליחה
                </button>
                {err && <div style={{ fontSize: 12, color: '#C05858' }}>{err}</div>}
              </div>
            )}

            {next && next.people.length > 0 && actionBtn('late', '⏩ נשארתי — האריכו.תי אחרי סיום המשמרת')}
            {actionOpen === 'late' && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8, padding: '10px 12px', background: '#FBFAF8', border: '1px solid #ECEAE5', borderRadius: 10 }}>
                <div style={{ fontSize: 12.5, color: '#6B6760' }}>למי מסרת.י את הזמן, מ{next.def?.name} של {shortDate(next.ds)}?</div>
                <select value={formCounterpart || ''} onChange={e => setFormCounterpart(e.target.value)}
                  style={{ border: '1px solid #E2DFD9', borderRadius: 8, padding: '8px 10px', fontSize: 13, fontFamily: 'inherit' }}>
                  <option value="">בחרו עמית.ה</option>
                  {next.people.map(id => <option key={id} value={id}>{empNames[id] || id}</option>)}
                </select>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <span style={{ fontSize: 12.5, color: '#6B6760' }}>סיימתי בפועל בשעה</span>
                  <input type="time" value={formTime} onChange={e => setFormTime(e.target.value)}
                    style={{ border: '1px solid #E2DFD9', borderRadius: 8, padding: '7px 9px', fontSize: 13, fontFamily: 'inherit' }} />
                </div>
                <button disabled={busy || !formCounterpart || !formTime}
                  onClick={() => askProposePartial('late', formCounterpart, next, formTime, formNote)}
                  style={{ background: TEAL, color: '#FFF', border: 'none', borderRadius: 8, padding: '9px 12px', fontSize: 13, fontWeight: 700, cursor: 'pointer', opacity: (!formCounterpart || !formTime) ? 0.5 : 1 }}>
                  שליחה
                </button>
                {err && <div style={{ fontSize: 12, color: '#C05858' }}>{err}</div>}
              </div>
            )}

            {actionBtn('hole', '✂️ קיצור בלי מחליף — נשאר חור במשמרת')}
            {actionOpen === 'hole' && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8, padding: '10px 12px', background: '#FBFAF8', border: '1px solid #ECEAE5', borderRadius: 10 }}>
                <div style={{ fontSize: 11.5, color: '#A8A49C', lineHeight: 1.5 }}>
                  תמיד מיידי, בלי אישור — משמש כשאין מי שיחליף וצריך לצמצם. עדכנו את שעת ההגעה או הסיום בפועל.
                </div>
                <div style={{ display: 'flex', gap: 8 }}>
                  <button onClick={() => setFormCounterpart('start')}
                    style={{ flex: 1, background: formCounterpart === 'start' ? INK : '#FFF', color: formCounterpart === 'start' ? '#FFF' : INK, border: '1.5px solid #E2DFD9', borderRadius: 8, padding: '8px 6px', fontSize: 12.5, fontWeight: 700, cursor: 'pointer' }}>
                    מתחיל.ה מאוחר יותר
                  </button>
                  <button onClick={() => setFormCounterpart('end')}
                    style={{ flex: 1, background: formCounterpart === 'end' ? INK : '#FFF', color: formCounterpart === 'end' ? '#FFF' : INK, border: '1.5px solid #E2DFD9', borderRadius: 8, padding: '8px 6px', fontSize: 12.5, fontWeight: 700, cursor: 'pointer' }}>
                    מסיים.ת מוקדם יותר
                  </button>
                </div>
                {formCounterpart && (
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <span style={{ fontSize: 12.5, color: '#6B6760' }}>{formCounterpart === 'start' ? 'שעת ההתחלה בפועל' : 'שעת הסיום בפועל'}</span>
                    <input type="time" value={formTime} onChange={e => setFormTime(e.target.value)}
                      style={{ border: '1px solid #E2DFD9', borderRadius: 8, padding: '7px 9px', fontSize: 13, fontFamily: 'inherit' }} />
                  </div>
                )}
                <textarea value={formNote} onChange={e => setFormNote(e.target.value)} placeholder="למה? (רשות, יוצג למשבץ)"
                  rows={2} style={{ border: '1px solid #E2DFD9', borderRadius: 8, padding: '8px 10px', fontSize: 13, fontFamily: 'inherit', resize: 'vertical' }} />
                <button disabled={busy || !formCounterpart || !formTime}
                  onClick={() => askShortenHole(formCounterpart, formTime, formNote)}
                  style={{ background: 'oklch(0.55 0.15 25)', color: '#FFF', border: 'none', borderRadius: 8, padding: '9px 12px', fontSize: 13, fontWeight: 700, cursor: 'pointer', opacity: (!formCounterpart || !formTime) ? 0.5 : 1 }}>
                  קיצור מיידי
                </button>
                {err && <div style={{ fontSize: 12, color: '#C05858' }}>{err}</div>}
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
    {confirm && (
      <ConfirmDialog title={confirm.title} body={confirm.body} confirmLabel={confirm.confirmLabel}
        danger={confirm.danger} busy={busy} onConfirm={runConfirmed} onCancel={() => setConfirm(null)} />
    )}
  </>);
}

/* ============ טאב חילופים: לוח פתוח + מה ממתין לי + הבקשות שלי ============ */
function SwapCard({ row, published, empNames, children }) {
  const nameOf = (id) => empNames[id] || id;
  return (
    <div style={{ background: '#FFF', border: '1px solid #EAE7E1', borderRadius: 12, padding: '12px 14px', display: 'flex', flexDirection: 'column', gap: 6 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
        <span style={{ fontSize: 13, fontWeight: 800 }}>{swapShiftName(row, published)}</span>
        <span style={{ fontSize: 12, color: '#8A867F' }}>{shortDate(row.date)}</span>
        <span style={{ fontSize: 11, fontWeight: 700, color: TEAL_DARK, background: TEAL_SOFT, borderRadius: 999, padding: '2px 8px' }}>{SWAP_KIND_LABEL[row.kind]}</span>
      </div>
      <div style={{ fontSize: 12.5, color: '#6B6760' }}>
        {row.kind === 'full' ? <>מאת <b>{nameOf(row.from_emp_id)}</b></>
          : row.kind === 'partial' ? <><b>{nameOf(row.from_emp_id)}</b> · {row.direction === 'early' ? 'הקדמת התחלה' : 'הארכת סיום'} מול {nameOf(row.to_emp_id)}</>
          : <><b>{nameOf(row.from_emp_id)}</b> קיצר.ה את המשמרת</>}
      </div>
      {row.note && <div style={{ fontSize: 12, color: '#8A867F', fontStyle: 'italic' }}>"{row.note}"</div>}
      {children}
    </div>
  );
}

function SwapsTab({ me, empNames, published, swaps, onRefresh, showToast, swapSettings }) {
  const [busy, setBusy] = React.useState(null);
  const [confirm, setConfirm] = React.useState(null);

  const act = async (id, fn) => {
    setBusy(id);
    try { await fn(); onRefresh(); showToast && showToast('בוצע ✓'); }
    catch (e) { showToast && showToast('שגיאה: ' + (e?.message || String(e))); }
    setBusy(null);
  };
  const runConfirmed = async () => {
    if (!confirm) return;
    await act(confirm.id, confirm.action);
    setConfirm(null);
  };
  const askClaim = (r) => {
    const o = swapOutcome('full', swapSettings || DEFAULT_SWAP_SETTINGS);
    setConfirm({
      id: r.id,
      title: o.immediate ? 'קבלת המשמרת' : 'בקשה לקחת את המשמרת',
      body: o.immediate
        ? <>המשמרת <b>{swapShiftName(r, published)}</b> ב-{shortDate(r.date)} תועבר מיד אליך. להמשיך?</>
        : <>הבקשה לקחת את <b>{swapShiftName(r, published)}</b> ב-{shortDate(r.date)} תישלח {o.note}. להמשיך?</>,
      confirmLabel: o.immediate ? 'כן, לקחת' : 'שליחת הבקשה',
      action: () => callSwaps('claim', { requestId: r.id, claimerEmpId: me.id }),
    });
  };

  const openMarket = swaps.filter(r => r.status === 'open' && (r.kind === 'full' || r.kind === 'partial'))
    .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  const incoming = swaps.filter(r => r.status === 'pending_peer' && r.to_emp_id === me.id);
  const mine = swaps.filter(r => r.from_emp_id === me.id && r.status !== 'cancelled')
    .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

  const sectionTitle = (t, n) => (
    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 4 }}>
      <div style={{ fontSize: 15, fontWeight: 900 }}>{t}</div>
      {n > 0 && <span style={{ fontSize: 11, fontWeight: 800, background: 'oklch(0.55 0.18 25)', color: '#FFF', borderRadius: 999, padding: '1px 8px' }}>{n}</span>}
    </div>
  );

  return (
    <div style={{ padding: '16px 16px 24px', display: 'flex', flexDirection: 'column', gap: 14 }}>
      {sectionTitle('מחכה לתגובה שלך', incoming.length)}
      {incoming.length ? incoming.map(r => (
        <SwapCard key={r.id} row={r} published={published} empNames={empNames}>
          <div style={{ display: 'flex', gap: 8, marginTop: 4 }}>
            <button disabled={busy === r.id} style={{ flex: 1, background: TEAL, color: '#FFF', border: 'none', borderRadius: 8, padding: '8px 10px', fontSize: 13, fontWeight: 700, cursor: 'pointer' }}
              onClick={() => act(r.id, () => callSwaps('respond', { requestId: r.id, role: 'peer', decision: 'accept', respondedBy: me.id }))}>
              קבלה
            </button>
            <button disabled={busy === r.id} style={{ flex: 1, background: '#FFF', color: INK, border: '1.5px solid #E2DFD9', borderRadius: 8, padding: '8px 10px', fontSize: 13, fontWeight: 700, cursor: 'pointer' }}
              onClick={() => act(r.id, () => callSwaps('respond', { requestId: r.id, role: 'peer', decision: 'reject', respondedBy: me.id }))}>
              דחייה
            </button>
          </div>
        </SwapCard>
      )) : <div style={{ fontSize: 13, color: '#8A867F' }}>אין כרגע הצעות שממתינות לתגובה שלך.</div>}

      {sectionTitle('לוח פתוח — הצעות מכל העובדים', 0)}
      {openMarket.length ? openMarket.map(r => (
        <SwapCard key={r.id} row={r} published={published} empNames={empNames}>
          {r.kind === 'full' && r.from_emp_id !== me.id && (
            <button disabled={busy === r.id} style={{ background: TEAL, color: '#FFF', border: 'none', borderRadius: 8, padding: '8px 10px', fontSize: 13, fontWeight: 700, cursor: 'pointer', marginTop: 4 }}
              onClick={() => askClaim(r)}>
              אני לוקח.ת את המשמרת
            </button>
          )}
          {r.from_emp_id === me.id && (
            <button disabled={busy === r.id} style={{ background: '#FFF', color: 'oklch(0.5 0.18 25)', border: '1.5px solid #E2DFD9', borderRadius: 8, padding: '7px 10px', fontSize: 12.5, fontWeight: 700, cursor: 'pointer', marginTop: 4 }}
              onClick={() => act(r.id, () => callSwaps('cancel', { requestId: r.id, byEmpId: me.id }))}>
              ביטול הפרסום
            </button>
          )}
        </SwapCard>
      )) : <div style={{ fontSize: 13, color: '#8A867F' }}>אין כרגע הצעות פתוחות בלוח.</div>}

      {sectionTitle('הבקשות שלך', 0)}
      {mine.length ? mine.map(r => (
        <SwapCard key={r.id} row={r} published={published} empNames={empNames}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 2 }}>
            <span style={{ fontSize: 11.5, fontWeight: 700, color: '#6B6760' }}>{SWAP_STATUS_LABEL[r.status] || r.status}</span>
            {['open', 'pending_peer', 'pending_manager'].includes(r.status) && (
              <button disabled={busy === r.id} style={{ marginInlineStart: 'auto', background: 'none', color: 'oklch(0.5 0.18 25)', border: 'none', fontSize: 12, fontWeight: 700, cursor: 'pointer', textDecoration: 'underline' }}
                onClick={() => act(r.id, () => callSwaps('cancel', { requestId: r.id, byEmpId: me.id }))}>
                ביטול
              </button>
            )}
          </div>
        </SwapCard>
      )) : <div style={{ fontSize: 13, color: '#8A867F' }}>עדיין לא פתחת בקשות חילוף.</div>}
      {confirm && (
        <ConfirmDialog title={confirm.title} body={confirm.body} confirmLabel={confirm.confirmLabel}
          busy={busy === confirm.id} onConfirm={runConfirmed} onCancel={() => setConfirm(null)} />
      )}
    </div>
  );
}

function SwapBanner({ items, empNames, published, goSwaps }) {
  const [i, setI] = React.useState(0);
  React.useEffect(() => {
    if (items.length < 2) return;
    const t = setInterval(() => setI(x => (x + 1) % items.length), 4500);
    return () => clearInterval(t);
  }, [items.length]);
  if (!items.length) return null;
  const r = items[i % items.length];
  return (
    <div onClick={goSwaps} style={{ background: 'oklch(0.94 0.05 80)', border: '1px solid oklch(0.8 0.1 70)', borderRadius: 12, padding: '11px 14px', cursor: 'pointer', display: 'flex', flexDirection: 'column', gap: 4, overflow: 'hidden' }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8 }}>
        <span style={{ fontSize: 11, fontWeight: 800, color: 'oklch(0.5 0.13 70)', letterSpacing: '0.03em' }}>📣 משמרות שצריכות חילוף</span>
        <span style={{ fontSize: 11, fontWeight: 700, color: 'oklch(0.5 0.13 70)' }}>לרשימה המלאה ←</span>
      </div>
      <div key={r.id} style={{ fontSize: 13, fontWeight: 700, color: INK, animation: 'fadeIn 0.3s' }}>
        {empNames[r.from_emp_id] || r.from_emp_id} מציע.ה {SWAP_KIND_LABEL[r.kind]} · {swapShiftName(r, published)} · {shortDate(r.date)}
      </div>
      {items.length > 1 && (
        <div style={{ display: 'flex', gap: 4, marginTop: 2 }}>
          {items.map((_, idx) => <span key={idx} style={{ width: 5, height: 5, borderRadius: '50%', background: idx === (i % items.length) ? 'oklch(0.5 0.13 70)' : 'oklch(0.85 0.05 70)' }} />)}
        </div>
      )}
    </div>
  );
}

function HomeTab({ me, empNames, published, TM, swaps, goSched, goReq, goSwaps, onOpenShift }) {
  const today = todayStr();
  const relOf = (off) => off === 0 ? 'היום' : off === 1 ? 'מחר' : `בעוד ${off} ימים`;
  const timeline = React.useMemo(() => buildTimeline(published), [published]);
  // כל מי שנמצא איתי בפועל, כולל ממשמרת מקבילה עם מזהה אחר שרצה באותן שעות (למשל יום קצר מול יום ארוך)
  const matesOf = (people, ds, shiftId) => {
    const overlap = overlapMates(timeline, ds, shiftId, me.id).map(m => m.id);
    return [...people.filter(p => p !== me.id), ...overlap].map(id => empNames[id] || id);
  };

  // כל המשמרות שלי מהיום והלאה, מכל החודשים שפורסמו
  const upcoming = [];
  Object.keys(published).sort().forEach(ym => {
    if (ym < TM) return;
    const days = buildMonthDays(ym, published[ym], me.id, empNames);
    days.forEach(d => {
      if (d.ds < today) return;
      d.shifts.filter(s => s.mine).forEach(sh => {
        upcoming.push({ ym, d, sh, off: diffDays(today, d.ds) });
      });
    });
  });
  upcoming.sort((a, b) => a.off - b.off);
  const hero = upcoming[0] || null;
  const firstName = (me.name || '').split(' ')[0];

  // הגשת בקשות פתוחה בפועל — רק אם המשבץ פרסם טיוטה במצב "פתוח לבקשות"
  const isReqOpen = (m) => published[m]?.shift_settings?._status === 'open';
  const openReqMonth = [addMonths(TM, 1), addMonths(TM, 2)].find(isReqOpen) || (isReqOpen(TM) ? TM : null);

  const openMarket = (swaps || []).filter(r => r.status === 'open' && (r.kind === 'full' || r.kind === 'partial'))
    .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);

  return (
    <div style={{ padding: '16px 16px 24px', display: 'flex', flexDirection: 'column', gap: 14, animation: 'fadeIn 0.25s' }}>
      <div style={{ fontSize: 24, fontWeight: 900 }}>שלום, {firstName}</div>

      {hero ? (
        <div onClick={() => onOpenShift(hero.ym, hero.d.ds, hero.sh.id)}
          style={{ background: INK, color: '#FFF', borderRadius: 18, padding: 20, display: 'flex', flexDirection: 'column', gap: 11, boxShadow: '0 12px 26px rgba(28,26,23,0.18)', cursor: 'pointer' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <span style={{ fontSize: 12, fontWeight: 800, color: 'color-mix(in oklab, #41ABC3 45%, white)', letterSpacing: '0.04em', whiteSpace: 'nowrap' }}>המשמרת הקרובה שלך</span>
            <span style={{ fontSize: 12, fontWeight: 800, background: TEAL, color: '#FFF', borderRadius: 999, padding: '4px 12px' }}>{relOf(hero.off)}</span>
          </div>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 10 }}>
            <span style={{ width: 10, height: 10, borderRadius: '50%', background: hero.sh.dot, flexShrink: 0 }} />
            <span style={{ fontSize: 34, fontWeight: 900, lineHeight: 1 }}>{hero.sh.label}</span>
            <span style={{ fontSize: 18, fontWeight: 700, color: 'rgba(255,255,255,0.85)', whiteSpace: 'nowrap' }}>{hero.sh.time}</span>
          </div>
          <div style={{ fontSize: 14, color: 'rgba(255,255,255,0.75)' }}>
            יום {hero.d.dayName}, {hero.d.num} {inMonthLabel(hero.ym)}
            {hero.d.holiday && <span style={{ marginInlineStart: 8, fontSize: 12, fontWeight: 700, color: '#FFF', background: 'oklch(0.5 0.13 250)', borderRadius: 999, padding: '2px 9px' }}>{hero.d.holiday}</span>}
          </div>
          <div style={{ fontSize: 13, color: 'rgba(255,255,255,0.6)', borderTop: '1px solid rgba(255,255,255,0.16)', paddingTop: 10 }}>
            {(() => { const mates = matesOf(hero.sh.people, hero.d.ds, hero.sh.id);
              return mates.length ? 'יחד עם: ' + mates.join(', ') : 'משמרת יחיד — אתם לבד במשמרת זו'; })()}
          </div>
        </div>
      ) : (
        <div style={{ background: INK, color: '#FFF', borderRadius: 18, padding: 20, display: 'flex', flexDirection: 'column', gap: 8 }}>
          <span style={{ fontSize: 12, fontWeight: 800, color: 'color-mix(in oklab, #41ABC3 45%, white)' }}>המשמרת הקרובה שלך</span>
          <span style={{ fontSize: 18, fontWeight: 800 }}>אין משמרות קרובות בסידור שפורסם</span>
        </div>
      )}

      {openReqMonth && (
        <div style={{ background: TEAL_SOFT, border: '1px solid color-mix(in oklab, #41ABC3 30%, white)', borderRadius: 12, padding: '12px 14px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10 }}>
          <span style={{ fontSize: 13, fontWeight: 700, color: 'color-mix(in oklab, #41ABC3 60%, black)' }}>הגשת הבקשות ל{monthName(openReqMonth)} פתוחה</span>
          <span onClick={goReq} style={{ fontSize: 13, fontWeight: 800, color: TEAL_DARK, cursor: 'pointer', flexShrink: 0 }}>להגשה ←</span>
        </div>
      )}

      <SwapBanner items={openMarket} empNames={empNames} published={published} goSwaps={goSwaps} />

      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 4 }}>
        <div style={{ fontSize: 15, fontWeight: 900 }}>המשמרות הבאות שלך</div>
        <div onClick={goSched} style={{ fontSize: 13, fontWeight: 700, color: TEAL_DARK, cursor: 'pointer', textDecoration: 'underline', textUnderlineOffset: 3 }}>לסידור המלא</div>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        {upcoming.slice(1, 6).map((u, i) => (
          <div key={i} onClick={() => onOpenShift(u.ym, u.d.ds, u.sh.id)}
            style={{ background: '#FFF', border: '1px solid #EAE7E1', borderRadius: 12, padding: '12px 14px', display: 'flex', alignItems: 'center', gap: 12, cursor: 'pointer' }}>
            <div style={{ width: 44, height: 44, borderRadius: 10, background: '#F1EFEB', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', flexShrink: 0, gap: 1 }}>
              <span style={{ fontSize: 16, fontWeight: 900, lineHeight: 1 }}>{u.d.num}</span>
              <span style={{ fontSize: 10, fontWeight: 700, color: '#8A867F' }}>{monthName(u.ym)}</span>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 2, flex: 1 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                <span style={{ width: 7, height: 7, borderRadius: '50%', background: u.sh.dot }} />
                <span style={{ fontSize: 14, fontWeight: 800 }}>{u.sh.label}</span>
                <span style={{ fontSize: 12, color: '#8A867F' }}>{u.sh.time}</span>
              </div>
              <div style={{ fontSize: 12, color: '#8A867F', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                {(() => { const mates = matesOf(u.sh.people, u.d.ds, u.sh.id);
                  return mates.length ? `יום ${u.d.dayName} · עם ${mates.join(', ')}` : `יום ${u.d.dayName} · משמרת יחיד`; })()}
              </div>
            </div>
            <div style={{ fontSize: 12, fontWeight: 700, color: '#56524C', flexShrink: 0 }}>{relOf(u.off)}</div>
          </div>
        ))}
        {upcoming.length <= 1 && <div style={{ padding: '20px 0', textAlign: 'center', fontSize: 13, color: '#8A867F' }}>אין משמרות נוספות בסידורים שפורסמו.</div>}
      </div>
    </div>
  );
}

/* ============ טאב הסידור ============ */
function ScheduleTab({ me, empNames, published, TM, serverReqs, goReq, onOpenShift }) {
  const months = React.useMemo(() => {
    const set = new Set([TM, addMonths(TM, 1), ...Object.keys(published)]);
    return [...set].sort();
  }, [published, TM]);
  const [mi, setMi] = React.useState(() => Math.max(0, months.indexOf(TM)));
  const [view, setView] = React.useState('grid');
  const [onlyMine, setOnlyMine] = React.useState(false);
  const ym = months[Math.min(mi, months.length - 1)];
  const pub = published[ym] || null;
  const today = todayStr();
  const todayNum = ym === TM ? Number(today.split('-')[2]) : null;

  const days = React.useMemo(() => pub ? buildMonthDays(ym, pub, me.id, empNames) : [], [pub, ym, me.id]);
  const unavailableArr = (serverReqs[ym] || {}).unavailable || [];
  const isUnavailable = (ds, shiftId) => unavailableArr.some(v => v === ds || v === ds + '@' + shiftId);
  const [selDay, setSelDay] = React.useState(todayNum || 1);
  const [weekIdx, setWeekIdx] = React.useState(() => Math.floor(((todayNum || 1) - 1 + monthOffset(ym)) / 7));

  const gotoMonth = (idx) => {
    const m = months[idx];
    const sel = (m === TM ? Number(today.split('-')[2]) : 1);
    setMi(idx); setSelDay(sel); setWeekIdx(Math.floor((sel - 1 + monthOffset(m)) / 7));
  };

  const offset = monthOffset(ym);
  const nDays = daysInMonth(ym);
  const sel = Math.min(selDay, nDays);

  const myCount = days.filter(d => d.mine).length;
  const nightCount = days.reduce((a, d) => a + d.shifts.filter(s => s.mine && s.id === 'night').length, 0);

  const letters = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'];
  const maxWeek = Math.floor((nDays - 1 + offset) / 7);
  const wi = Math.min(weekIdx, maxWeek);
  const dFirst = Math.max(1, wi * 7 - offset + 1);
  const dLast = Math.min(nDays, wi * 7 - offset + 7);

  return (
    <div style={{ padding: '16px 16px 24px', display: 'flex', flexDirection: 'column', gap: 12, animation: 'fadeIn 0.25s' }}>
      <div style={{ fontSize: 24, fontWeight: 900 }}>הסידור</div>
      <MonthSwitcher label={monthLabel(ym)} canPrev={mi > 0} canNext={mi < months.length - 1}
        onPrev={() => gotoMonth(mi - 1)} onNext={() => gotoMonth(mi + 1)} />

      {!pub ? (
        <div style={{ padding: '56px 24px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 12, textAlign: 'center' }}>
          <div style={{ width: 58, height: 58, borderRadius: 14, background: '#F1EFEB', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 26, fontWeight: 900, color: '#A09C94' }}>?</div>
          <div style={{ fontSize: 17, fontWeight: 800 }}>הסידור ל{monthLabel(ym)} טרם פורסם</div>
          <div style={{ fontSize: 14, color: '#6B6760', lineHeight: 1.6, maxWidth: 280 }}>ברגע שהמנהל יפרסם את הסידור, הוא יופיע כאן.</div>
          <div onClick={goReq} style={{ marginTop: 8, background: INK, color: '#FFF', borderRadius: 8, padding: '12px 22px', fontSize: 14, fontWeight: 800, cursor: 'pointer' }}>
            להגשת בקשות ל{monthName(ym)}
          </div>
        </div>
      ) : (<>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <div style={{ display: 'flex', background: '#F1EFEB', borderRadius: 10, padding: 3 }}>
            {[['grid', 'לוח'], ['list', 'רשימה']].map(([v, label]) => (
              <div key={v} onClick={() => setView(v)} style={{ padding: '7px 16px', borderRadius: 8, fontSize: 13, fontWeight: 800, cursor: 'pointer',
                background: view === v ? INK : 'transparent', color: view === v ? '#FFF' : '#8A867F', transition: 'background 0.15s, color 0.15s' }}>{label}</div>
            ))}
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <span style={{ fontSize: 12, fontWeight: 700, color: '#56524C' }}>רק שלי</span>
            <div onClick={() => setOnlyMine(o => !o)} style={{ width: 42, height: 24, borderRadius: 999, background: onlyMine ? TEAL : '#D8D4CE', position: 'relative', cursor: 'pointer', transition: 'background 0.2s' }}>
              <div style={{ position: 'absolute', top: 2, right: 2, width: 20, height: 20, borderRadius: '50%', background: '#FFF', boxShadow: '0 1px 3px rgba(0,0,0,0.3)',
                transform: onlyMine ? 'translateX(-18px)' : 'translateX(0)', transition: 'transform 0.2s' }} />
            </div>
          </div>
        </div>
        <div style={{ alignSelf: 'flex-start', fontSize: 12, fontWeight: 800, color: TEAL_DARK, background: TEAL_SOFT, borderRadius: 999, padding: '5px 12px' }}>
          {myCount} משמרות החודש · {nightCount === 1 ? 'לילה אחד' : `${nightCount} לילות`}
        </div>

        {view === 'grid' && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 5 }}>
              {['א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ש'].map(l => <div key={l} style={{ textAlign: 'center', fontSize: 11, fontWeight: 700, color: '#A09C94' }}>{l}</div>)}
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 5 }}>
              {Array.from({ length: offset }).map((_, i) => <div key={'pad' + i} />)}
              {days.map(d => {
                const isSel = d.num === sel;
                const isToday = todayNum === d.num;
                return (
                  <div key={d.num} onClick={() => setSelDay(d.num)} style={{ aspectRatio: '0.92', borderRadius: 10,
                    background: isSel ? INK : (d.mine ? TEAL_SOFT : '#FFF'), color: isSel ? '#FFF' : INK,
                    border: isSel ? `1.5px solid ${INK}` : (isToday ? `2px solid ${INK}` : (d.holiday ? '1.5px solid oklch(0.6 0.14 250)' : (d.mine ? `1.5px solid ${TEAL}` : '1px solid #E7E4DF'))),
                    opacity: (onlyMine && !d.mine && !isSel) ? 0.35 : 1,
                    display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 4, cursor: 'pointer',
                    transition: 'background 0.15s, opacity 0.2s' }}>
                    <div style={{ fontSize: 13, fontWeight: 700 }}>{d.num}</div>
                    <div style={{ display: 'flex', gap: 3 }}>
                      {d.shifts.slice(0, 3).map((s, i) => <span key={i} style={{ width: 5, height: 5, borderRadius: '50%', background: isSel ? 'rgba(255,255,255,0.85)' : s.dot }} />)}
                    </div>
                  </div>
                );
              })}
            </div>
            <div style={{ background: '#FFF', borderRadius: 14, border: '1px solid #EAE7E1', padding: 14, display: 'flex', flexDirection: 'column', gap: 9 }}>
              {(() => {
                const d = days[sel - 1];
                if (!d) return null;
                const use = onlyMine ? d.shifts.filter(s => s.mine) : d.shifts;
                return (<>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                    <div style={{ fontSize: 14, fontWeight: 900 }}>יום {d.dayName}, {d.num} {inMonthLabel(ym)}{todayNum === d.num ? ' · היום' : ''}</div>
                    {d.holiday && <span style={{ fontSize: 11, fontWeight: 700, color: 'oklch(0.45 0.13 250)', background: 'oklch(0.94 0.05 250)', borderRadius: 999, padding: '3px 9px' }}>{d.holiday}</span>}
                  </div>
                  {use.length === 0 && <div style={{ fontSize: 13, color: '#8A867F' }}>{onlyMine ? 'אין לך משמרות ביום זה.' : 'אין משמרות ביום זה.'}</div>}
                  {use.map((sh, i) => <ShiftRow key={i} sh={sh} myId={me.id} empNames={empNames} blocked={isUnavailable(d.ds, sh.id)}
                    onOpen={sh.mine ? () => onOpenShift(ym, d.ds, sh.id) : null} />)}
                </>);
              })()}
            </div>
          </div>
        )}

        {view === 'list' && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <div style={{ fontSize: 14, fontWeight: 800 }}>שבוע {dFirst}–{dLast} {inMonthLabel(ym)}</div>
              <div style={{ display: 'flex', gap: 6 }}>
                <div onClick={() => wi > 0 && (setWeekIdx(wi - 1), setSelDay(Math.max(1, (wi - 1) * 7 - offset + 1)))}
                  style={{ width: 28, height: 28, borderRadius: 8, background: '#F1EFEB', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, cursor: 'pointer', opacity: wi > 0 ? 1 : 0.3 }}>›</div>
                <div onClick={() => wi < maxWeek && (setWeekIdx(wi + 1), setSelDay(Math.min(nDays, (wi + 1) * 7 - offset + 1)))}
                  style={{ width: 28, height: 28, borderRadius: 8, background: '#F1EFEB', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, cursor: 'pointer', opacity: wi < maxWeek ? 1 : 0.3 }}>‹</div>
              </div>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 5 }}>
              {Array.from({ length: 7 }).map((_, s) => {
                const dn = wi * 7 - offset + 1 + s;
                if (dn < 1 || dn > nDays) return <div key={s} />;
                const d = days[dn - 1];
                const act = dn === sel;
                return (
                  <div key={s} onClick={() => setSelDay(dn)} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3, padding: '8px 0 7px', borderRadius: 11,
                    background: act ? INK : 'transparent', color: act ? '#FFF' : INK,
                    border: (todayNum === dn && !act) ? `1.5px solid ${INK}` : '1px solid transparent', cursor: 'pointer' }}>
                    <div style={{ fontSize: 10, fontWeight: 600, opacity: 0.75 }}>{letters[s]}</div>
                    <div style={{ fontSize: 15, fontWeight: 800 }}>{dn}</div>
                    <div style={{ width: 5, height: 5, borderRadius: '50%', background: d.mine ? (act ? 'rgba(255,255,255,0.9)' : TEAL) : 'transparent' }} />
                  </div>
                );
              })}
            </div>
            {Array.from({ length: dLast - dFirst + 1 }).map((_, i) => {
              const dn = dFirst + i;
              const d = days[dn - 1];
              const mineShifts = d.shifts.filter(s => s.mine);
              const use = onlyMine ? mineShifts : d.shifts;
              const isThin = onlyMine && mineShifts.length === 0;
              const expanded = dn === sel && !isThin;
              return (
                <div key={dn} onClick={() => setSelDay(dn)} style={{ background: '#FFF', borderRadius: 14, border: expanded ? `1.5px solid ${INK}` : '1px solid #E7E4DF', padding: 13,
                  display: 'flex', flexDirection: 'column', gap: 9, cursor: 'pointer', transition: 'border 0.15s' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                    <div style={{ fontSize: 14, fontWeight: 800 }}>יום {d.dayName} · {dn} {inMonthLabel(ym)}{todayNum === dn ? ' · היום' : ''}</div>
                    {d.mine && <span style={{ fontSize: 11, fontWeight: 800, color: '#FFF', background: TEAL, borderRadius: 999, padding: '3px 9px' }}>משמרת שלך</span>}
                    {d.holiday && <span style={{ fontSize: 11, fontWeight: 700, color: 'oklch(0.45 0.13 250)', background: 'oklch(0.94 0.05 250)', borderRadius: 999, padding: '3px 9px' }}>{d.holiday}</span>}
                  </div>
                  {isThin && <div style={{ fontSize: 12, color: '#A09C94' }}>אין משמרות שלך ביום זה</div>}
                  {!expanded && !isThin && (
                    <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                      {use.map((s, j) => (
                        <span key={j} style={{ display: 'flex', alignItems: 'center', gap: 5, padding: '4px 10px', borderRadius: 999, background: '#F4F2EE', fontSize: 11, fontWeight: 600, color: '#56524C' }}>
                          <span style={{ width: 5, height: 5, borderRadius: '50%', background: s.dot }} />{s.label}
                        </span>
                      ))}
                      {use.length === 0 && <span style={{ fontSize: 12, color: '#A09C94' }}>אין משמרות</span>}
                    </div>
                  )}
                  {expanded && use.map((sh, j) => <ShiftRow key={j} sh={sh} myId={me.id} empNames={empNames} blocked={isUnavailable(d.ds, sh.id)}
                    onOpen={sh.mine ? () => onOpenShift(ym, d.ds, sh.id) : null} />)}
                </div>
              );
            })}
          </div>
        )}
      </>)}
    </div>
  );
}
