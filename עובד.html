/* ============ מסך ניהול בקשות קבועות ============ */
const WEEKDAY_NAMES = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
const MARK_LABEL = { un: 'לא זמינ.ה', high: 'מעדיפ.ה', can: 'זמינ.ה', iron: '🔒 ברזל (קבוע ע"י המשבץ)' };
// תאריך מייצג לכל יום בשבוע בחודש הנוכחי, כדי לדעת אילו משמרות קיימות בו (הן משתנות בין חול/שישי/שבת)
function firstDateForWeekday(ym, wd) {
  for (let d = 1; d <= daysInMonth(ym); d++) {
    const ds = `${ym}-${pad(d)}`;
    if (weekdayOf(ds) === wd) return ds;
  }
  return `${ym}-01`;
}

function RecurringRequestsScreen({ me, TM, globalSettings, recurring, onClose, onChanged, showToast }) {
  const [busy, setBusy] = React.useState(false);
  const [form, setForm] = React.useState({ weekday: 5, shiftId: '', mark: 'un' });

  const shiftsFor = (wd) => shiftTypesFor(firstDateForWeekday(TM, wd), globalSettings).filter(s => !s.continuation);

  const addRule = async () => {
    setBusy(true);
    try {
      const { error } = await sb.from('employee_recurring_requests').insert({
        emp_id: me.id, weekday: form.weekday, shift_id: form.shiftId || null, mark: form.mark, active: true,
      });
      if (error) throw error;
      onChanged();
      showToast && showToast('בקשה קבועה נוספה ✓');
    } catch (e) {
      showToast && showToast('שגיאה: ' + (e?.message || String(e)));
    }
    setBusy(false);
  };
  const toggleRule = async (r) => {
    setBusy(true);
    await sb.from('employee_recurring_requests').update({ active: !r.active }).eq('id', r.id);
    onChanged();
    setBusy(false);
  };
  const deleteRule = async (r) => {
    setBusy(true);
    await sb.from('employee_recurring_requests').delete().eq('id', r.id);
    onChanged();
    setBusy(false);
  };

  const byWeekday = {};
  recurring.forEach(r => (byWeekday[r.weekday] = byWeekday[r.weekday] || []).push(r));

  return (
    <div style={{ flex: 1, overflowY: 'auto', animation: 'fadeIn 0.2s' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '14px 16px 6px' }}>
        <span onClick={onClose} style={{ fontSize: 22, fontWeight: 900, color: INK, cursor: 'pointer', lineHeight: 1, padding: '0 4px' }}>→</span>
        <span style={{ fontSize: 16, fontWeight: 900 }}>בקשות קבועות</span>
      </div>
      <div style={{ padding: '10px 16px 28px', display: 'flex', flexDirection: 'column', gap: 16 }}>
        <div style={{ fontSize: 12.5, color: '#6B6760', lineHeight: 1.6 }}>
          בקשה קבועה מתמלאת אוטומטית בכל חודש חדש, לפי יום בשבוע — עד שתכבו אותה. אפשר תמיד
          לשנות ידנית יום ספציפי בהגשת הבקשות החודשית; זה לא משנה את הכלל הקבוע.
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {[0, 1, 2, 3, 4, 5, 6].map(wd => (byWeekday[wd] || []).length > 0 && (
            <div key={wd} style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
              <div style={{ fontSize: 12, fontWeight: 800, color: '#8A867F' }}>יום {WEEKDAY_NAMES[wd]}</div>
              {byWeekday[wd].map(r => r.mark === 'iron' ? (
                <div key={r.id} style={{ display: 'flex', alignItems: 'center', gap: 10, background: 'oklch(0.97 0.02 300)', border: '1.5px solid oklch(0.45 0.18 300)',
                  borderRadius: 10, padding: '10px 12px' }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <span style={{ fontSize: 13, fontWeight: 700 }}>{r.shift_id ? (shiftsFor(wd).find(s => s.id === r.shift_id)?.name || r.shift_id) : 'כל היום'}</span>
                    <span style={{ fontSize: 12, color: 'oklch(0.45 0.18 300)', marginInlineStart: 8, fontWeight: 700 }}>{MARK_LABEL[r.mark]}</span>
                    <div style={{ fontSize: 11, color: '#8A867F', marginTop: 3 }}>נקבע ע"י המשבץ — לביטול תאריך ספציפי, סמנו אותו כ"לא זמין" בהגשת הבקשות</div>
                  </div>
                </div>
              ) : (
                <div key={r.id} style={{ display: 'flex', alignItems: 'center', gap: 10, background: '#FFF', border: '1px solid #EAE7E1',
                  borderRadius: 10, padding: '10px 12px', opacity: r.active ? 1 : 0.5 }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <span style={{ fontSize: 13, fontWeight: 700 }}>{r.shift_id ? (shiftsFor(wd).find(s => s.id === r.shift_id)?.name || r.shift_id) : 'כל היום'}</span>
                    <span style={{ fontSize: 12, color: '#8A867F', marginInlineStart: 8 }}>{MARK_LABEL[r.mark] || r.mark}</span>
                  </div>
                  <label style={{ position: 'relative', display: 'inline-block', width: 38, height: 22, flexShrink: 0 }}>
                    <input type="checkbox" checked={r.active} disabled={busy} onChange={() => toggleRule(r)}
                      style={{ opacity: 0, width: 0, height: 0, position: 'absolute' }} />
                    <span style={{ position: 'absolute', inset: 0, borderRadius: 11, background: r.active ? TEAL : '#D0CEC9', transition: 'background 0.2s', cursor: 'pointer', direction: 'ltr' }}>
                      <span style={{ position: 'absolute', top: 3, left: r.active ? 19 : 3, width: 16, height: 16, borderRadius: '50%', background: '#FFF', transition: 'left 0.2s' }} />
                    </span>
                  </label>
                  <span onClick={() => !busy && deleteRule(r)} style={{ cursor: busy ? 'default' : 'pointer', color: 'oklch(0.5 0.18 25)', fontWeight: 900, fontSize: 16, padding: '0 4px' }}>×</span>
                </div>
              ))}
            </div>
          ))}
          {!recurring.length && <div style={{ fontSize: 13, color: '#8A867F' }}>עדיין אין בקשות קבועות.</div>}
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 10, background: '#FBFAF8', border: '1px solid #ECEAE5', borderRadius: 12, padding: 14 }}>
          <div style={{ fontSize: 13, fontWeight: 800 }}>+ הוספת בקשה קבועה</div>
          <select value={form.weekday} onChange={e => setForm(f => ({ ...f, weekday: Number(e.target.value), shiftId: '' }))}
            style={{ border: '1px solid #E2DFD9', borderRadius: 8, padding: '8px 10px', fontSize: 13, fontFamily: 'inherit' }}>
            {[0, 1, 2, 3, 4, 5, 6].map(wd => <option key={wd} value={wd}>יום {WEEKDAY_NAMES[wd]}</option>)}
          </select>
          <select value={form.shiftId} onChange={e => setForm(f => ({ ...f, shiftId: e.target.value }))}
            style={{ border: '1px solid #E2DFD9', borderRadius: 8, padding: '8px 10px', fontSize: 13, fontFamily: 'inherit' }}>
            <option value="">כל היום</option>
            {shiftsFor(form.weekday).map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
          <select value={form.mark} onChange={e => setForm(f => ({ ...f, mark: e.target.value }))}
            style={{ border: '1px solid #E2DFD9', borderRadius: 8, padding: '8px 10px', fontSize: 13, fontFamily: 'inherit' }}>
            {['un', 'high', 'can'].map(m => <option key={m} value={m}>{MARK_LABEL[m]}</option>)}
          </select>
          <button disabled={busy} onClick={addRule}
            style={{ background: TEAL, color: '#FFF', border: 'none', borderRadius: 9, padding: '10px 0', fontSize: 14, fontWeight: 800, cursor: 'pointer' }}>
            הוספה
          </button>
        </div>
      </div>
    </div>
  );
}

function RequestsTab({ me, email, published, TM, globalSettings, serverReqs, setServerReqs, localReqs, setLocalReqs, showToast, anthropicKey, recurring, criteria, mgrEmps, myPrefs, goRecurring }) {
  // הקריטריונים הכלליים, נדרסים ע"י קריטריונים אישיים שהמשבץ הגדיר לעובד הזה (emp.reqCriteria) אם יש
  const myCriteria = React.useMemo(() => {
    const base = criteria || DEFAULT_REQUEST_CRITERIA;
    const mine = (mgrEmps || []).find(e => e.id === me.id);
    return { ...base, ...(mine?.reqCriteria || {}) };
  }, [criteria, mgrEmps, me.id]);
  // תיאור קריא של myCriteria — לתצוגה בלבד (הדרופדאון "מה מצופה ממני"), רק תנאים פעילים.
  // key תואם למפתחות ש-meetsRequestCriteria מחזירה, לחיבור ה-✓ החי ליד כל שורה.
  const myCriteriaLines = React.useMemo(() => {
    const lines = [];
    if (myCriteria.minNightsPerWeek > 0) lines.push({ key: 'minNightsPerWeek', text: `לפחות ${myCriteria.minNightsPerWeek} לילות זמינים בכל שבוע` });
    if (myCriteria.minDaysPerWeek > 0) lines.push({ key: 'minDaysPerWeek', text: `לפחות ${myCriteria.minDaysPerWeek} ימים זמינים בכל שבוע` });
    if (myCriteria.minFridaysCanPerMonth > 0) lines.push({ key: 'minFridaysCanPerMonth', text: 'לפחות שישי קצר/ארוך אחד פנוי במהלך החודש (לא כולל שבת ארוכה)' });
    if (myCriteria.minSaturdaysCanPerMonth > 0) lines.push({ key: 'minSaturdaysCanPerMonth', text: 'לפחות בוקר שבת אחד פנוי במהלך החודש (לא כולל שבת ארוכה/מוצאי שבת)' });
    return lines;
  }, [myCriteria]);
  const months = React.useMemo(() => [addMonths(TM, -1), TM, addMonths(TM, 1), addMonths(TM, 2)], [TM]);
  const [mi, setMi] = React.useState(() => {
    // ברירת מחדל: תמיד החודש הבא (index 2) — בין אם הוא כבר פתוח לבקשות ובין אם לא
    const i = months.indexOf(addMonths(TM, 1));
    return i === -1 ? months.length - 1 : i;
  });
  const [brush, setBrush] = React.useState('un');
  const [saving, setSaving] = React.useState(false);
  const [criteriaGateOpen, setCriteriaGateOpen] = React.useState(false);
  const [analyzing, setAnalyzing] = React.useState(false);
  const [aiError, setAiError] = React.useState(null);
  const [lastAiResult, setLastAiResult] = React.useState(null);
  const [aiFeedback, setAiFeedback] = React.useState(null);
  const [feedbackNote, setFeedbackNote] = React.useState('');
  const [feedbackSaving, setFeedbackSaving] = React.useState(false);
  const [feedbackSaved, setFeedbackSaved] = React.useState(false);
  const ym = months[mi];
  const pubRow = published[ym] || null;
  const openStatus = pubRow?.shift_settings?._status === 'open';
  // אין אפשרות להגיש בקשות עד שהמשבץ פותח טיוטה לבקשות בפועל — "לא פורסם עדיין" אינו "פתוח"
  const editable = openStatus;
  const openRange = openStatus ? (pubRow?.shift_settings?._range || null) : null;
  const local = localReqs[ym] || { marks: {}, note: '', mgrNote: '', dirty: false };
  // ברירת מחדל: "avail" (מסמנ.ת זמינות) — כך שימים/משמרות שלא נגעו בהם נחשבים "לא זמין"
  // ולא "יכול", ועובד שלא ביצע שום שינוי לא ישובץ בטעות למשמרת שהוא לא יכול לעבוד בה.
  const reqMode = local.reqMode || 'avail';
  const server = serverReqs[ym] || null;
  const nDays = daysInMonth(ym);
  const rangeStart = openRange?.start || `${ym}-01`;
  const rangeEnd   = openRange?.end   || `${ym}-${pad(nDays)}`;
  // listDates helper (inline to avoid dependency on external util)
  const rangeDates = React.useMemo(() => {
    const out = [];
    let cur = rangeStart;
    while (cur <= rangeEnd) {
      out.push(cur);
      const d = new Date(cur + 'T12:00:00');
      d.setDate(d.getDate() + 1);
      cur = d.toISOString().slice(0, 10);
    }
    return out;
  }, [rangeStart, rangeEnd]);
  // ימים שהמשבץ החריג מהטווח בטיוטה (עריכת טווח) — מוצגים בלוח אבל לא ניתנים לסימון
  // ולא נכנסים לשום חישוב בפועל (הגשה, בדיקת קריטריונים, פרומפט ה-AI)
  const excludedSet = React.useMemo(() => new Set(openRange?.excluded || []), [openRange]);
  const activeDates = React.useMemo(() => rangeDates.filter(d => !excludedSet.has(d)), [rangeDates, excludedSet]);
  const gridOffset = weekdayOf(rangeStart);
  // gridOffset = weekday of first cell in calendar = weekday of rangeStart
  const [selDay, setSelDay] = React.useState(rangeStart);
  React.useEffect(() => {
    setSelDay(rangeStart);
    const mode = localReqs[ym]?.reqMode || 'avail';
    setBrush(mode === 'block' ? 'un' : 'can');
    setLastAiResult(null);
    setAiFeedback(null);
    setFeedbackNote('');
    setFeedbackSaved(false);
  }, [ym]);
  const selDs = selDay;
  const sel = Number(selDs.slice(8));

  // הגדרות משמרות לפירוט היום: של החודש אם פורסם → העדכניות מהמשבץ → של הפרסום האחרון → ברירת מחדל
  const lastPubSettings = React.useMemo(() => {
    const keys = Object.keys(published).sort();
    for (let i = keys.length - 1; i >= 0; i--) {
      if (published[keys[i]]?.shift_settings) return published[keys[i]].shift_settings;
    }
    return null;
  }, [published]);
  const settings = published[ym]?.shift_settings || globalSettings || lastPubSettings;
  const dayShiftsAll = shiftTypesFor(selDs, settings);
  const dayShifts = dayShiftsAll.filter(s => !s.continuation);       // ניתנות לסימון ביום זה
  const contShifts = dayShiftsAll.filter(s => s.continuation);       // המשך משמרת רב-יומית — מידע בלבד

  // מזהי המשמרות הניתנות לסימון בתאריך נתון (לא כולל "המשך" רב-יומי)
  const dayShiftIds = (ds) => shiftTypesFor(ds, settings).filter(s => !s.continuation).map(s => s.id);
  // האם משמרת מסוימת חסומה לפי ההעדפות שהעובד סימן בהגדרות (עושה שישי קצר/ארוך, שבת ארוכה,
  // בוקר שבת, ללא משמרות לילה) — לא נעילה מוחלטת, ניתנת לדריסה ידנית בדיוק לפי משמרת
  const isShiftBlockedByPrefs = (ds, shiftId) => {
    if (!myPrefs) return false;
    const wd = weekdayOf(ds);
    if (wd === 5 && shiftId === 'short') return myPrefs.wants_friday_short === false;
    if (wd === 5 && shiftId === 'morning') return myPrefs.wants_friday_long === false;
    if (shiftId === 'shabbat') return myPrefs.wants_shabbat_long === false;
    if (wd === 6 && shiftId === 'morning') return myPrefs.wants_saturday_short === false;
    if (shiftId === 'night') return myPrefs.no_weekday_nights === true;
    return false;
  };
  const allShiftsBlocked = (ds) => {
    const ids = dayShiftIds(ds);
    return ids.length > 0 && ids.every(id => isShiftBlockedByPrefs(ds, id));
  };
  // מרחיב תאריכים לגמרי לא-מסומנים לפי ברירת המחדל של המצב — אבל משמרת חסומה תמיד "לא",
  // גם אם המצב הכללי הוא "מסמן חסימות" (שאר הימים = יכול)
  const expandUnmarked = (dates) => {
    const out = { unavailable: [], can: [] };
    dates.forEach(ds => {
      const ids = dayShiftIds(ds);
      const blocked = ids.filter(id => isShiftBlockedByPrefs(ds, id));
      if (!blocked.length) {
        out[reqMode === 'block' ? 'can' : 'unavailable'].push(ds);
      } else if (blocked.length === ids.length) {
        out.unavailable.push(ds);
      } else {
        ids.forEach(id => {
          out[blocked.includes(id) ? 'unavailable' : (reqMode === 'block' ? 'can' : 'unavailable')].push(`${ds}@${id}`);
        });
      }
    });
    return out;
  };

  const setLocal = (patch) => setLocalReqs(prev => ({ ...prev, [ym]: { ...(prev[ym] || { marks: {}, note: '', mgrNote: '', dirty: false }), ...patch } }));

  // דפוס הבקשות הקבועות, לפי יום בשבוע. משמרת ספציפית → אובייקט per-shift; "כל היום" → מחרוזת.
  // אם הוגדרו גם "כל היום" וגם משמרת ספציפית לאותו יום בשבוע, "כל היום" גובר (מוגדר אחרון בלולאה).
  // "ברזל" (מוגדר ע"י המשבץ) מתנהג בדיוק כמו "מעדיפ.ה" (high) בכל הלוגיקה הזו — הוא
  // רק מוצג אחרת (🔒, ראו ironPattern) ואי אפשר לכבות/למחוק אותו כאן, רק לבטל תאריך ספציפי.
  const recurringPattern = React.useMemo(() => {
    const byWd = {};
    (recurring || []).filter(r => r.active).forEach(r => {
      const mark = r.mark === 'iron' ? 'high' : r.mark;
      if (r.shift_id) {
        if (typeof byWd[r.weekday] !== 'object' || byWd[r.weekday] === null) byWd[r.weekday] = {};
        if (typeof byWd[r.weekday] === 'object') byWd[r.weekday][r.shift_id] = mark;
      } else {
        byWd[r.weekday] = mark;
      }
    });
    return byWd;
  }, [recurring]);

  // רק לצורך תג 🔒 — אילו ימי/משמרות בשבוע הם "ברזל" (קבוע ע"י המשבץ)
  const ironPattern = React.useMemo(() => {
    const byWd = {};
    (recurring || []).filter(r => r.active && r.mark === 'iron').forEach(r => {
      if (r.shift_id) {
        if (typeof byWd[r.weekday] !== 'object' || byWd[r.weekday] === null) byWd[r.weekday] = {};
        if (typeof byWd[r.weekday] === 'object') byWd[r.weekday][r.shift_id] = true;
      } else {
        byWd[r.weekday] = true;
      }
    });
    return byWd;
  }, [recurring]);

  // מה שבאמת יישלח: בקשות קבועות + דריסות ספציפיות לחודש הזה, שתמיד מנצחות.
  // local.marks[ds] === null = "בוטל לחודש הזה בלבד" (הדריסה עצמה נשארת פעילה לחודשים הבאים).
  const effectiveMarks = React.useMemo(() => {
    const out = {};
    activeDates.forEach(ds => {
      let v;
      if (Object.prototype.hasOwnProperty.call(local.marks, ds)) {
        if (local.marks[ds] !== null) v = local.marks[ds];
      } else {
        const p = recurringPattern[weekdayOf(ds)];
        if (p !== undefined) v = p;
      }
      if (v === undefined) return; // יום לגמרי לא מסומן — ברירת המחדל הכללית (כולל חסימות) תיושם בהמשך
      const ids = dayShiftIds(ds);
      const blocked = ids.filter(id => isShiftBlockedByPrefs(ds, id));
      if (!blocked.length) { out[ds] = v; return; }
      // משמרת חסומה לפי ההעדפות — נכפית ל"לא" גם אם היום כולו סומן אחרת, אלא אם נדרסה במפורש
      const perShift = (v && typeof v === 'object') ? { ...v } : {};
      ids.forEach(id => {
        if (Object.prototype.hasOwnProperty.call(perShift, id)) return;
        if (blocked.includes(id)) { perShift[id] = 'un'; return; }
        if (typeof v === 'string') perShift[id] = v;
      });
      out[ds] = perShift;
    });
    return out;
  }, [activeDates, recurringPattern, local.marks, myPrefs]);

  const resetMonth = () => {
    setLocal({ marks: {}, dirty: true });
    showToast && showToast('הבקשות אופסו — נשארו רק הבקשות הקבועות שלך');
  };

  const setReqMode = (mode) => {
    if (mode === reqMode) return;
    setLocal({ reqMode: mode });
    setBrush(mode === 'block' ? 'un' : 'can');
  };

  // הקשה על יום בלוח: בוחרת אותו, ובמצב עריכה גם צובעת את כל היום.
  // יום עם סימון חלקי (לפי משמרות) — הקשה רק בוחרת, כדי לא לדרוס את הדיוק; מחיקה עובדת תמיד.
  const tapDay = (dStr) => {
    setSelDay(dStr);
    if (!editable || !brush) return;
    const cur = effectiveMarks[dStr];
    if (cur && typeof cur === 'object' && brush !== 'erase') return;
    const marks = { ...local.marks };
    if (brush === 'erase') {
      // אם יש כאן בקשה קבועה, "מחיקה" צריכה לבטל אותה לחודש הזה בלבד — לא סתם למחוק
      // מפתח ולתת לה להציץ בחזרה. אם אין בקשה קבועה, מספיק להסיר את הדריסה המקומית.
      if (recurringPattern[weekdayOf(dStr)] !== undefined) marks[dStr] = null; else delete marks[dStr];
    } else {
      marks[dStr] = brush;
    }
    setLocal({ marks, dirty: true });
  };

  // קביעת סימון למשמרת בודדת מכרטיס הפירוט. יום שצבוע במלואו נפרס קודם לכל המשמרות.
  const setShiftMark = (sid, mark) => {
    if (!editable) return;
    const ids = dayShifts.map(s => s.id);
    const marks = { ...local.marks };
    const cur = effectiveMarks[selDs];
    let obj = {};
    if (typeof cur === 'string') ids.forEach(id => { obj[id] = cur; });
    else if (cur) obj = { ...cur };
    if (mark) obj[sid] = mark; else delete obj[sid];
    const vals = ids.map(id => obj[id]);
    if (!Object.keys(obj).length) {
      if (recurringPattern[weekdayOf(selDs)] !== undefined) marks[selDs] = null; else delete marks[selDs];
    }
    else if (ids.length && vals.every(v => v && v === vals[0]) && Object.keys(obj).length === ids.length) marks[selDs] = vals[0];
    else marks[selDs] = obj;
    setLocal({ marks, dirty: true });
  };


  const submit = async () => {
    if (saving) return;
    setSaving(true);
    // "YYYY-MM-DD" = יום שלם, "YYYY-MM-DD@shiftId" = משמרת בודדת. משתמשים ב-effectiveMarks
    // (לא local.marks) כדי שבקשות קבועות שלא נגעו בהן החודש ייכללו בהגשה בפועל.
    const toDates = (mark) => {
      const out = [];
      Object.entries(effectiveMarks).forEach(([ds, v]) => {
        if (typeof v === 'string') { if (v === mark) out.push(ds); }
        else Object.entries(v || {}).forEach(([sid, m]) => { if (m === mark) out.push(`${ds}@${sid}`); });
      });
      return out.sort();
    };
    // הרחבת סימונים משתמעים: ימים לא-מסומנים (בטווח בפועל, לא כולל ימים מוחרגים) מקבלים
    // את הסטטוס ברירת-מחדל של המצב הנוכחי — למעט משמרות חסומות לפי ההעדפות, שתמיד "לא"
    const markedDs = new Set(Object.keys(effectiveMarks));
    const unmarkedDates = activeDates.filter(ds => !markedDs.has(ds));
    let unavailable = toDates('un');
    let canArr = toDates('can');
    const expandedUnmarked = expandUnmarked(unmarkedDates);
    unavailable = [...unavailable, ...expandedUnmarked.unavailable];
    canArr = [...canArr, ...expandedUnmarked.can];
    // משמרות לא-מסומנות בימים עם סימון חלקי → ברירת מחדל של המצב
    // (למשל: אם "לילה=יכול" ביום שלישי, שאר המשמרות של אותו יום נחסמות)
    Object.entries(effectiveMarks).forEach(([ds, v]) => {
      if (typeof v !== 'object' || !v) return;
      shiftTypesFor(ds, settings).filter(s => !s.continuation).forEach(sh => {
        if (v[sh.id]) return;
        if (reqMode === 'block') canArr.push(`${ds}@${sh.id}`);
        else unavailable.push(`${ds}@${sh.id}`);
      });
    });
    unavailable = unavailable.sort();
    canArr = canArr.sort();
    const row = {
      emp_id: me.id, month: ym,
      unavailable, high: toDates('high'), can: canArr,
      note: local.note || '', manager_note: local.mgrNote || '',
      updated_at: new Date().toISOString(), updated_by: email,
    };
    const { data, error } = await sb.from('employee_requests').upsert(row).select().single();
    setSaving(false);
    if (error) { console.error(error); showToast('שגיאה בשליחה — נסו שוב'); return; }
    setServerReqs(prev => ({ ...prev, [ym]: data }));
    setLocal({ dirty: false });
    showToast('הבקשות נשלחו ✓');
  };

  // לפני שליחה בפועל: אם יש חריגות מהמינימום שהמשבץ ביקש, מציגים פופ-אפ עם אפשרות
  // "לשלוח בכל זאת" או "לחזור לעריכת הבקשה" — במקום להציג אזהרה קבועה על המסך
  const trySubmit = () => {
    if (criteriaWarnings.length > 0) { setCriteriaGateOpen(true); return; }
    submit();
  };

  const analyzeText = async () => {
    const text = (local.note || '').trim();
    if (!text || !anthropicKey || analyzing) return;
    const keyTrimmed = anthropicKey.trim();
    if (!keyTrimmed.startsWith('sk-ant-')) {
      setAiError(`מפתח לא תקין (${keyTrimmed.slice(0, 12)}…) — המנהל צריך ללחוץ ☁ שמור לענן בהגדרות`);
      return;
    }
    setAnalyzing(true); setAiError(null);
    try {
      const scheduleLabel = openRange
        ? `הסידור (${rangeStart.slice(8)}.${rangeStart.slice(5,7)}–${rangeEnd.slice(8)}.${rangeEnd.slice(5,7)})`
        : `חודש ${monthLabel(ym)} (${ym})`;
      const datesList = activeDates.map(ds => `${ds} — יום ${HEB_DAYS[weekdayOf(ds)]}`).join('\n');
      const shiftLine = (label, list) => label + ': ' + (list || []).map(s => `${s.id} = ${s.name} ${s.start}–${s.end}`).join(' · ');
      const shiftsDesc = [
        shiftLine('ימי חול (א׳–ה׳)', settings?.weekday),
        shiftLine('שישי', settings?.friday),
        shiftLine('שבת', settings?.saturday),
      ].join('\n');

      // Fetch recent corrections from admin feedback — injected as few-shot examples
      let fewShotBlock = '';
      try {
        const { data: fbRows } = await sb.from('ai_feedback')
          .select('original_text, ai_result, correction')
          .eq('rating', 'bad')
          .not('correction', 'is', null)
          .neq('correction', '')
          .order('created_at', { ascending: false })
          .limit(5);
        if (fbRows?.length) {
          const examples = fbRows.map((r, i) => [
            `דוגמה ${i + 1}:`,
            `בקשת עובד: "${r.original_text}"`,
            `ניתוח שגוי שהוחזר: ${JSON.stringify(r.ai_result)}`,
            `תיקון המנהל: ${r.correction}`,
          ].join('\n')).join('\n\n');
          fewShotBlock = `\n\n## תיקונים של המנהל על ניתוחים קודמים — למד מהם\n${examples}\n\nהימנע מאותן שגיאות בניתוח הנוכחי.`;
        }
      } catch (_) { /* non-critical — continue without examples */ }

      const prompt = `אתה מנתח בקשת עובד לסידור עבודה עבור ${scheduleLabel}.
הסידור כולל ימים מחוץ לחודש הקלנדרי — כשהעובד אומר "כל ימי ראשון" או "כל החודש" הכוונה לכל הימים ברשימה למטה.

## כל ימי הסידור וימי השבוע שלהם
${datesList}

## המשמרות הקיימות
${shiftsDesc}

## הבקשה החופשית
"${text}"

## משימה
**שלב 1 — זהה מצב:**
- avail (מסמן זמינות): העובד מציין **מתי יכול** ("יכול בשישי", "זמין בלילות") → כל מה שלא ציין = חסום
- block (מסמן חסימות): העובד מציין **מתי לא יכול** ("לא יכול שני", "חופשה ב-15") → כל מה שלא ציין = יכול

**שלב 2 — תרגם לתאריכים.** החזר JSON בלבד:
{
  "mode": "avail" | "block",
  "unavailable": ["YYYY-MM-DD","YYYY-MM-DD@shiftId",...],
  "high": [...],
  "can": [...],
  "note": "סיכום קצר בעברית"
}
כללים:
- unavailable = לא יכול/לא זמין/לא רוצה
- can = יכול/זמין/גמיש/פנוי — בלי ציון רצון ביום/משמרת ספציפיים
- high = כל בקשה חיובית ומפורשת ליום/משמרת ספציפיים ("מעדיף","רוצה","ממש רוצה","חשוב לי") — אם העובד אומר שהוא רוצה לעבוד ביום/משמרת מסוימים (לא רק שהוא יכול), זו בקשה בתעדוף. "יכול" בלי ציון רצון = can לא high
- במצב avail: מלא can (ו-high לבקשות מועדפות). השאר unavailable ריק — הימים שלא ציינת ייחסמו אוטומטית
- במצב block: מלא unavailable. השאר can ריק — הימים שלא ציינת ייחשבו זמינים אוטומטית
- אם סומנה משמרת ספציפית ביום — **רק אותה משמרת** מקבלת סימון; שאר המשמרות באותו יום ייחסמו אוטומטית
- כלל עסקי: בוקר קצר (short) קצר בשעה אחת בלבד מבוקר רגיל (morning). זמינות לבוקר = זמינות גם לבוקר קצר — אלא אם העובד ציין במפורש אחרת
- יום שלם: "YYYY-MM-DD"; משמרת ספציפית: "YYYY-MM-DD@shiftId"
- השתמש רק במזהי משמרות מהרשימה למעלה
- כל התאריכים חייבים להיות מהרשימה למעלה (בין ${rangeStart} ל-${rangeEnd}) — כולל ימים מחוץ לחודש הקלנדרי${fewShotBlock}`;
      const callApi = async (msgs, sys) => {
        const body = { model: 'claude-sonnet-4-6', max_tokens: 1024, messages: msgs };
        if (sys) body.system = sys;
        const r = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-api-key': keyTrimmed,
            'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
          body: JSON.stringify(body),
        });
        if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error?.message || `HTTP ${r.status}`); }
        const d = await r.json();
        return d.content?.find(b => b.type === 'text')?.text || '';
      };

      const extractJson = (raw) => {
        const m = raw.match(/\{[\s\S]*\}/);
        if (!m) return null;
        try { return JSON.parse(m[0]); } catch { return null; }
      };

      const systemMsg = 'ענה בJSON בלבד — ללא טקסט לפני או אחרי האובייקט.';
      let raw = await callApi([{ role: 'user', content: prompt }], systemMsg);
      let result = extractJson(raw);
      if (!result) {
        // retry once — ask explicitly for JSON
        raw = await callApi([
          { role: 'user', content: prompt },
          { role: 'assistant', content: raw },
          { role: 'user', content: 'החזר את התשובה כ-JSON בלבד, ללא טקסט נוסף.' },
        ], systemMsg);
        result = extractJson(raw);
      }
      if (!result) throw new Error('לא התקבל JSON תקין');
      const inRange = (arr) => (Array.isArray(arr) ? arr.filter(v => {
        if (typeof v !== 'string') return false;
        const ds = v.includes('@') ? v.split('@')[0] : v;
        return ds >= rangeStart && ds <= rangeEnd;
      }) : []);
      // המרה לפורמט marks: {"YYYY-MM-DD": mark} או {"YYYY-MM-DD": {shiftId: mark}}
      const newMarks = { ...local.marks };
      [['unavailable', 'un'], ['high', 'high'], ['can', 'can']].forEach(([key, mark]) => {
        inRange(result[key] || []).forEach(entry => {
          const at = entry.indexOf('@');
          const ds = at === -1 ? entry : entry.slice(0, at);
          const sid = at === -1 ? null : entry.slice(at + 1);
          if (!ds) return;
          if (sid) {
            if (typeof newMarks[ds] !== 'object' || !newMarks[ds]) newMarks[ds] = {};
            newMarks[ds] = { ...(typeof newMarks[ds] === 'object' ? newMarks[ds] : {}), [sid]: mark };
          } else {
            newMarks[ds] = mark;
          }
        });
      });
      // הרחבת ימים עם סימון חלקי: משמרות לא-מסומנות מקבלות ברירת מחדל של המצב
      // (למשל: "לילה=יכול" ב-14 → בוקר/קצר ב-14 = un אוטומטית במצב avail)
      const finalMode = (result.mode === 'avail' || result.mode === 'block') ? result.mode : reqMode;
      Object.entries(newMarks).forEach(([ds, v]) => {
        if (typeof v !== 'object' || !v) return;
        const expanded = { ...v };
        let changed = false;
        shiftTypesFor(ds, settings).filter(s => !s.continuation).forEach(sh => {
          if (!expanded[sh.id]) { expanded[sh.id] = finalMode === 'block' ? 'can' : 'un'; changed = true; }
        });
        if (changed) newMarks[ds] = expanded;
      });
      const aiMode = result.mode === 'avail' || result.mode === 'block' ? result.mode : null;
      const modeChanged = aiMode && aiMode !== reqMode;
      setLocal({ marks: newMarks, note: result.note || local.note, dirty: true, ...(aiMode ? { reqMode: aiMode } : {}) });
      if (modeChanged) setBrush(aiMode === 'block' ? 'un' : 'can');
      showToast(modeChanged
        ? `AI זיהה מצב ${aiMode === 'avail' ? 'זמינות' : 'חסימות'} ועדכן ✓`
        : 'הסימונים עודכנו ✓ — בדקו וערכו לפי הצורך');
      if (IMPERSONATE_ID) {
        setLastAiResult({ text, result });
        setAiFeedback(null);
        setFeedbackNote('');
        setFeedbackSaved(false);
      }
    } catch (err) {
      setAiError(`שגיאת ניתוח: ${err.message}`);
    } finally {
      setAnalyzing(false);
    }
  };

  const saveFeedback = async () => {
    if (!aiFeedback || !lastAiResult || feedbackSaving) return;
    setFeedbackSaving(true);
    try {
      const { error } = await sb.from('ai_feedback').insert({
        emp_id: me?.id,
        emp_name: me?.name,
        month: ym,
        original_text: lastAiResult.text,
        ai_result: lastAiResult.result,
        rating: aiFeedback,
        correction: feedbackNote.trim() || null,
      });
      if (error) throw error;
      setFeedbackSaved(true);
      setTimeout(() => setFeedbackSaved(false), 4000);
    } catch (err) {
      showToast('שגיאה בשמירת משוב');
    } finally {
      setFeedbackSaving(false);
    }
  };

  const hasMarks = Object.keys(effectiveMarks).length > 0;
  const needSend = !server || local.dirty;
  const stats = React.useMemo(() => {
    const s = { un: 0, high: 0, can: 0, days: 0, shifts: 0 };
    Object.values(effectiveMarks).forEach(v => {
      if (typeof v === 'string') { s.days++; s[v]++; }
      else Object.values(v || {}).forEach(m => { s.shifts++; s[m]++; });
    });
    return s;
  }, [effectiveMarks]);
  const sentAt = fmtSentAt(server?.updated_at);

  // שורת זמינות "אפקטיבית" — marks + ברירת המחדל של המצב, בדיוק מה שיישלח בפועל ב-submit()
  const effectiveRow = React.useMemo(() => {
    const unmarkedDates = activeDates.filter(ds => !Object.prototype.hasOwnProperty.call(effectiveMarks, ds));
    const row = { unavailable: [], high: [], can: [] };
    Object.entries(effectiveMarks).forEach(([ds, v]) => {
      if (typeof v === 'string') row[v === 'un' ? 'unavailable' : v === 'high' ? 'high' : 'can'].push(ds);
      else Object.entries(v || {}).forEach(([sid, m]) => row[m === 'un' ? 'unavailable' : m === 'high' ? 'high' : 'can'].push(`${ds}@${sid}`));
    });
    const expanded = expandUnmarked(unmarkedDates);
    row.unavailable.push(...expanded.unavailable);
    row.can.push(...expanded.can);
    return row;
  }, [effectiveMarks, activeDates, reqMode, myPrefs]);

  // אזהרה בלבד — לא חוסמת שליחה
  const criteriaWarnings = React.useMemo(() => {
    if (!editable) return [];
    return checkRequestCriteria(activeDates, effectiveRow, settings, myCriteria);
  }, [effectiveRow, activeDates, settings, myCriteria, editable]);

  // מצב "✓ עומד בקריטריון" חי, לכל סוג קריטריון בנפרד — לדרופדאון "מה מצופה ממני"
  const myCriteriaMet = React.useMemo(() => {
    return meetsRequestCriteria(activeDates, effectiveRow, settings, myCriteria);
  }, [effectiveRow, activeDates, settings, myCriteria]);

  const BRUSHES = reqMode === 'block'
    ? [{ id: 'un', label: 'לא זמינ.ה' }, { id: 'high', label: 'מעדיפ.ה' }, { id: 'erase', label: 'מחיקה' }]
    : [{ id: 'can', label: 'זמינ.ה' }, { id: 'high', label: 'מעדיפ.ה' }, { id: 'erase', label: 'מחיקה' }];

  return (
    <div style={{ padding: '16px 16px 24px', display: 'flex', flexDirection: 'column', gap: 12, animation: 'fadeIn 0.25s' }}>
      <div style={{ fontSize: 24, fontWeight: 900 }}>הגשת בקשות</div>
      <MonthSwitcher label={monthLabel(ym)} canPrev={mi > 0} canNext={mi < months.length - 1}
        onPrev={() => setMi(mi - 1)} onNext={() => setMi(mi + 1)} />

      {editable && hasMarks && (
        <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
          <span onClick={resetMonth} style={{ fontSize: 12.5, fontWeight: 700, color: '#A09C94', cursor: 'pointer' }}>↺ איפוס החודש</span>
        </div>
      )}
      {editable && myCriteriaLines.length > 0 && (
        <details style={{ background: 'color-mix(in oklab, oklch(0.65 0.15 200) 8%, #FFF)', border: '1px solid color-mix(in oklab, oklch(0.65 0.15 200) 25%, transparent)', borderRadius: 10, padding: '9px 14px' }}>
          <summary style={{ fontSize: 12.5, fontWeight: 700, color: 'oklch(0.38 0.14 200)', cursor: 'pointer' }}>📋 מה מצופה ממני בהגשה החודשית</summary>
          <div style={{ marginTop: 6, display: 'flex', flexDirection: 'column', gap: 3 }}>
            {myCriteriaLines.map(l => (
              <div key={l.key} style={{ display: 'flex', alignItems: 'center', gap: 5, fontSize: 12, color: '#4A5A66' }}>
                <span>· {l.text}</span>
                {myCriteriaMet[l.key] && <span title="עומד בקריטריון הזה" style={{ color: '#3FA85C', fontWeight: 800 }}>✓</span>}
              </div>
            ))}
          </div>
        </details>
      )}
      {editable ? (<>
        {/* בחירת מצב הגשה */}
        <div style={{ display: 'flex', gap: 8 }}>
          {[
            { id: 'block', label: 'מסמן חסימות', sub: 'שאר הימים = יכול' },
            { id: 'avail', label: 'מסמן זמינות', sub: 'שאר הימים = חסום' },
          ].map(m => {
            const active = reqMode === m.id;
            return (
              <div key={m.id} onClick={() => setReqMode(m.id)} style={{ flex: 1, padding: '9px 10px', borderRadius: 10, textAlign: 'center', cursor: 'pointer',
                background: active ? INK : '#FFF', border: active ? `2px solid ${INK}` : '1.5px solid #D8D4CE',
                color: active ? '#FFF' : '#6B6760', transition: 'background 0.15s, border 0.15s, color 0.15s' }}>
                <div style={{ fontSize: 13, fontWeight: 800 }}>{m.label}</div>
                <div style={{ fontSize: 11, marginTop: 2, opacity: active ? 0.75 : 0.65 }}>{m.sub}</div>
              </div>
            );
          })}
        </div>
        <div style={{ fontSize: 12, color: '#8A867F' }}>{brush ? '1. בוחרים סימון · 2. מקישים על הימים בלוח' : 'לחצו על יום לצפייה — בחרו סימון כדי לערוך'}</div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 7 }}>
          {BRUSHES.map(c => {
            const s = c.id === 'erase' ? { bg: '#FFF', bd: '1px solid #D8D4CE', fg: '#6B6760' } : MARK_STATUS[c.id];
            const active = brush === c.id;
            return (
              <div key={c.id} onClick={() => setBrush(b => b === c.id ? null : c.id)} style={{ padding: '9px 0', borderRadius: 10, background: active ? s.bg : '#FFF', color: active ? s.fg : '#A09C94',
                border: active ? `2px solid ${s.fg}` : s.bd, boxShadow: active ? '0 3px 10px rgba(30,28,24,0.16)' : 'none',
                fontSize: 12, fontWeight: 800, textAlign: 'center', cursor: 'pointer', transition: 'box-shadow 0.15s, border 0.15s, background 0.15s' }}>{c.label}</div>
            );
          })}
        </div>
      </>) : (
        <div style={{ background: '#F1EFEB', borderRadius: 10, padding: '11px 14px', fontSize: 13, fontWeight: 700, color: '#56524C' }}>
          הסידור לחודש זה כבר פורסם — הבקשות מוצגות לקריאה בלבד.
        </div>
      )}

      {(editable || hasMarks) && (<>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 5 }}>
          {['א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ש'].map(l => <div key={l} style={{ textAlign: 'center', fontSize: 11, fontWeight: 700, color: '#A09C94' }}>{l}</div>)}
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 5 }}>
          {Array.from({ length: gridOffset }).map((_, i) => <div key={'pad' + i} />)}
          {rangeDates.map(dStr => {
            const isExcluded = excludedSet.has(dStr);
            const v = effectiveMarks[dStr];
            const isRecurring = v !== undefined && !Object.prototype.hasOwnProperty.call(local.marks, dStr);
            const ironVal = ironPattern[weekdayOf(dStr)];
            const isIron = isRecurring && (ironVal === true || (ironVal && typeof ironVal === 'object' && Object.keys(ironVal).length > 0));
            const whole = typeof v === 'string';
            const inCurMonth = dStr.startsWith(ym);
            const impliedMark = !v && editable && !isExcluded
              ? (allShiftsBlocked(dStr) ? 'un' : (reqMode === 'block' ? 'can' : 'un'))
              : null;
            const s = v
              ? MARK_STATUS[whole ? v : 'none']
              : (impliedMark ? MARK_STATUS_FADED[impliedMark] : MARK_STATUS['none']);
            const dots = !whole && v ? Object.values(v).map(m => MARK_STATUS[m]?.fg).filter(Boolean) : [];
            const isSel = dStr === selDs;
            const dayNum = Number(dStr.slice(8));
            return (
              <div key={dStr} onClick={() => !isExcluded && tapDay(dStr)}
                title={isExcluded ? 'מחוץ לטווח הסידור' : undefined}
                style={{ position: 'relative', aspectRatio: '1', borderRadius: 10,
                background: isExcluded ? 'repeating-linear-gradient(135deg, #EFEDE9, #EFEDE9 5px, #F7F6F3 5px, #F7F6F3 10px)' : s.bg,
                border: isExcluded ? '1px solid #E4E1DB' : (isSel ? `2px solid ${INK}` : (isRecurring ? `1.5px dashed ${s.fg}` : s.bd)),
                color: isExcluded ? '#B7B3AB' : s.fg,
                display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 2,
                fontSize: 13, fontWeight: inCurMonth ? 700 : 500,
                cursor: isExcluded ? 'default' : 'pointer', transition: 'background 0.15s, border 0.15s',
                opacity: isExcluded ? 0.7 : (inCurMonth ? 1 : 0.75) }}>
                {isRecurring && !isExcluded && <span style={{ position: 'absolute', top: 3, insetInlineEnd: 4, fontSize: 8 }}>{isIron ? '🔒' : '🔁'}</span>}
                <span>{dayNum}</span>
                {dots.length > 0 && (
                  <span style={{ display: 'flex', gap: 2 }}>
                    {dots.slice(0, 4).map((c, j) => <span key={j} style={{ width: 5, height: 5, borderRadius: '50%', background: c }} />)}
                  </span>
                )}
              </div>
            );
          })}
        </div>
        <div style={{ fontSize: 12, fontWeight: 600, color: '#8A867F', textAlign: 'center' }}>
          {stats.un} לא זמין · {stats.high} מעדיף · {stats.can} יכול
          {stats.shifts > 0 && <> — {stats.days} ימים מלאים · {stats.shifts} משמרות</>}
          {editable && (() => {
            const markedCount = Object.keys(effectiveMarks).length;
            const impliedCount = activeDates.length - markedCount;
            return impliedCount > 0 ? (
              <span style={{ color: reqMode === 'block' ? MARK_STATUS_FADED.can.fg : MARK_STATUS_FADED.un.fg }}>
                {' · '}{impliedCount} {reqMode === 'block' ? 'יכול (ברירת מחדל)' : 'לא זמין (ברירת מחדל)'}
              </span>
            ) : null;
          })()}
        </div>

        {/* כרטיס פירוט היום הנבחר — דיוק ברמת משמרת */}
        <div style={{ background: '#FFF', borderRadius: 14, border: '1px solid #EAE7E1', padding: 14, display: 'flex', flexDirection: 'column', gap: 9 }}>
          <div style={{ fontSize: 14, fontWeight: 900 }}>יום {HEB_DAYS[weekdayOf(selDs)]}, {sel} {inMonthLabel(selDs.slice(0, 7))}</div>
          {editable && !Object.prototype.hasOwnProperty.call(local.marks, selDs) && recurringPattern[weekdayOf(selDs)] !== undefined && (() => {
            const ironVal = ironPattern[weekdayOf(selDs)];
            const isIron = ironVal === true || (ironVal && typeof ironVal === 'object' && Object.keys(ironVal).length > 0);
            return isIron ? (
              <div style={{ fontSize: 11.5, color: 'oklch(0.45 0.18 300)', background: 'oklch(0.97 0.02 300)', borderRadius: 8, padding: '5px 9px', alignSelf: 'flex-start' }}>🔒 משמרת קבועה שהמשבץ סימן — אפשר לבטל ליום הזה בלבד באמצעות סימון "לא זמין"</div>
            ) : (
              <div style={{ fontSize: 11.5, color: TEAL_DARK, background: TEAL_SOFT, borderRadius: 8, padding: '5px 9px', alignSelf: 'flex-start' }}>🔁 מהבקשה הקבועה שלך — שינוי כאן ישפיע רק על החודש הזה</div>
            );
          })()}
          {editable && <div style={{ fontSize: 12, color: '#8A867F' }}>דיוק לפי משמרת — בחרו סימון לכל משמרת בנפרד:</div>}
          {dayShifts.map(sh => {
            const dayMark = effectiveMarks[selDs];
            const rawCur = typeof dayMark === 'string' ? dayMark : (dayMark || {})[sh.id] || null;
            // יום שלא נגעו בו כלל (לא ב-effectiveMarks) — עדיין מציגים "לא" כברירת מחדל למשמרת חסומה
            const cur = rawCur || (isShiftBlockedByPrefs(selDs, sh.id) ? 'un' : null);
            const CHIPS = [[null, '—'], ['un', 'לא'], ['high', 'מעדיף'], ['can', 'יכול']];
            return (
              <div key={sh.id} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '8px 10px', borderRadius: 10, background: '#FBFAF8', border: '1px solid #ECEAE5' }}>
                <span style={{ width: 8, height: 8, borderRadius: '50%', background: dotOf(sh.id), flexShrink: 0 }} />
                <span style={{ fontSize: 13, fontWeight: 800, whiteSpace: 'nowrap' }}>{sh.name}</span>
                <span style={{ fontSize: 11, color: '#8A867F', whiteSpace: 'nowrap' }}>{sh.start}–{sh.end}</span>
                {editable ? (
                  <span style={{ display: 'flex', gap: 4, marginInlineStart: 'auto' }}>
                    {CHIPS.map(([m, label]) => {
                      const st = m ? MARK_STATUS[m] : { bg: '#FFF', bd: '1px solid #D8D4CE', fg: '#6B6760' };
                      const active = cur === m;
                      return (
                        <span key={label} onClick={() => setShiftMark(sh.id, m)} style={{
                          padding: '5px 9px', borderRadius: 8, fontSize: 11.5, fontWeight: 800,
                          background: active ? st.bg : '#FFF', color: active ? st.fg : '#A09C94',
                          border: active ? (m ? st.bd : `1.5px solid ${INK}`) : '1px solid #E7E4DF',
                          cursor: 'pointer', transition: 'background 0.15s, border 0.15s' }}>
                          {label}
                        </span>
                      );
                    })}
                  </span>
                ) : (
                  <span style={{ marginInlineStart: 'auto', fontSize: 11.5, fontWeight: 700, color: '#A09C94' }}>
                    {{ un: 'לא', high: 'מעדיף', can: 'יכול' }[cur] || 'לא סומן'}
                  </span>
                )}
              </div>
            );
          })}
          {contShifts.map(sh => (
            <div key={'cont-' + sh.id} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '8px 10px', borderRadius: 10, background: 'oklch(0.96 0.04 80)', border: '1px dashed oklch(0.72 0.1 70)' }}>
              <span style={{ width: 8, height: 8, borderRadius: '50%', background: dotOf(sh.id), flexShrink: 0 }} />
              <span style={{ fontSize: 13, fontWeight: 800 }}>{sh.name}</span>
              <span style={{ fontSize: 11, color: '#8A867F' }}>נמשכת מ־{shortDate(sh.originDate)} — לסימון בחרו את יום ההתחלה</span>
            </div>
          ))}
          {!dayShifts.length && !contShifts.length && <div style={{ fontSize: 12, color: '#A09C94' }}>לא הוגדרו משמרות ליום זה.</div>}
        </div>
      </>)}

      <span onClick={goRecurring} style={{ alignSelf: 'flex-start', fontSize: 13, fontWeight: 800, color: TEAL_DARK, cursor: 'pointer', textDecoration: 'underline', textUnderlineOffset: 3 }}>
        🔁 בקשות קבועות{recurring?.filter(r => r.active).length > 0 ? ` (${recurring.filter(r => r.active).length})` : ''}
      </span>

      {editable && (<>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          <div style={{ fontSize: 12, fontWeight: 800, color: '#56524C' }}>בקשה חופשית</div>
          <textarea placeholder='כתבו בקשה בשפה חופשית — למשל "לא יכול ימי שני לילה, מעדיף רביעי בוקר"' value={local.note}
            onChange={e => { setLocal({ note: e.target.value, dirty: true }); setAiError(null); }}
            style={{ border: `1.5px solid ${INK}`, borderRadius: 10, padding: '12px 14px', fontSize: 13, background: '#FFF', color: INK, resize: 'none', height: 80 }} />
          {anthropicKey ? (
            <div onClick={!analyzing && local.note?.trim() ? analyzeText : undefined} style={{
              background: analyzing || !local.note?.trim() ? '#F1EFEB' : TEAL,
              color: analyzing || !local.note?.trim() ? '#A09C94' : '#FFF',
              borderRadius: 10, padding: '12px 0', textAlign: 'center', fontSize: 14, fontWeight: 800,
              cursor: analyzing || !local.note?.trim() ? 'default' : 'pointer', transition: 'background 0.2s' }}>
              {analyzing ? '⏳ מנתח…' : '⚡ נתח עם AI — עדכן יומן'}
            </div>
          ) : (
            <div style={{ fontSize: 12, color: '#A09C94', textAlign: 'center', padding: '8px 0' }}>ניתוח AI לא זמין — המנהל לא הגדיר מפתח</div>
          )}
          {aiError && <div style={{ fontSize: 12, fontWeight: 600, color: 'oklch(0.5 0.18 25)', background: 'oklch(0.97 0.03 25)', borderRadius: 8, padding: '8px 12px' }}>{aiError}</div>}
          {IMPERSONATE_ID && lastAiResult && (
            <div style={{ background: 'oklch(0.97 0.015 80)', border: '1px solid oklch(0.88 0.04 80)', borderRadius: 10, padding: '12px 14px', display: 'flex', flexDirection: 'column', gap: 8 }}>
              <div style={{ fontSize: 12, fontWeight: 800, color: '#56524C' }}>🔑 משוב אדמין — דיוק ניתוח AI:</div>
              <div style={{ display: 'flex', gap: 8 }}>
                {[['good', '👍 נכון'], ['bad', '👎 שגוי']].map(([v, label]) => {
                  const active = aiFeedback === v;
                  const okColor = 'oklch(0.6 0.2 140)';
                  const errColor = 'oklch(0.7 0.15 25)';
                  return (
                    <div key={v} onClick={() => setAiFeedback(av => av === v ? null : v)} style={{
                      flex: 1, padding: '9px 0', textAlign: 'center', borderRadius: 9, fontSize: 13, fontWeight: 700, cursor: 'pointer',
                      background: active ? (v === 'good' ? 'oklch(0.92 0.08 140)' : 'oklch(0.95 0.06 25)') : '#FFF',
                      border: `1.5px solid ${active ? (v === 'good' ? okColor : errColor) : '#D8D4CE'}`,
                      color: active ? (v === 'good' ? 'oklch(0.35 0.18 140)' : 'oklch(0.45 0.18 25)') : '#6B6760',
                    }}>{label}</div>
                  );
                })}
              </div>
              {aiFeedback === 'bad' && (
                <textarea value={feedbackNote} onChange={e => setFeedbackNote(e.target.value)}
                  placeholder="מה היה שגוי? (ישמש לשיפור הפרומפט בעתיד)"
                  style={{ border: '1.5px solid #D8D4CE', borderRadius: 8, padding: '9px 11px', fontSize: 12, resize: 'none', height: 62, background: '#FFF', color: INK, font: 'inherit' }} />
              )}
              {aiFeedback && !feedbackSaved && (
                <div onClick={feedbackSaving ? undefined : saveFeedback} style={{
                  background: INK, color: '#FFF', borderRadius: 8, padding: '10px 0',
                  textAlign: 'center', fontSize: 13, fontWeight: 800,
                  cursor: feedbackSaving ? 'default' : 'pointer', opacity: feedbackSaving ? 0.6 : 1,
                }}>
                  {feedbackSaving ? 'שומר…' : '← שמור משוב'}
                </div>
              )}
              {feedbackSaved && (
                <div style={{ textAlign: 'center', fontSize: 12, fontWeight: 700, color: 'oklch(0.42 0.18 140)' }}>✓ המשוב נשמר — תודה!</div>
              )}
            </div>
          )}
        </div>

        {/* הערה למשבץ — נפרדת מהטקסט ל-AI, לא מתפרשת לתאריכים, רק מוצגת למשבץ כפי שהיא */}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          <div style={{ fontSize: 12, fontWeight: 800, color: '#56524C' }}>הערה למשבץ (רשות)</div>
          <div style={{ fontSize: 11.5, color: '#8A867F', marginTop: -4 }}>לא מתורגמת אוטומטית לתאריכים — תוצג למשבץ כפי שהיא, ליד השם שלך.</div>
          <textarea placeholder='למשל: "יש לי אירוע משפחתי בסוף החודש, אשמח לגמישות" או בקשה מיוחדת אחרת'
            value={local.mgrNote || ''}
            onChange={e => setLocal({ mgrNote: e.target.value, dirty: true })}
            style={{ border: '1.5px solid #D8D4CE', borderRadius: 10, padding: '12px 14px', fontSize: 13, background: '#FFF', color: INK, resize: 'none', height: 64, font: 'inherit' }} />
        </div>

        <div onClick={needSend ? trySubmit : undefined} style={{
          background: needSend ? INK : '#FFF', color: needSend ? '#FFF' : TEAL_DARK,
          border: needSend ? `1.5px solid ${INK}` : `1.5px solid ${TEAL}`,
          borderRadius: 10, padding: '14px 0', textAlign: 'center', fontSize: 15, fontWeight: 800, cursor: needSend ? 'pointer' : 'default',
          opacity: saving ? 0.6 : 1, transition: 'background 0.2s, color 0.2s' }}>
          {saving ? 'שולח…' : needSend ? (server ? 'שליחת עדכון' : 'שליחת בקשות') : 'הבקשות נשלחו ✓'}
        </div>
        {sentAt && (
          <div style={{ fontSize: 12, fontWeight: 600, color: '#8A867F', textAlign: 'center' }}>
            עודכן לאחרונה: {sentAt}{local.dirty ? ' · יש שינויים שטרם נשלחו' : ''}
          </div>
        )}
      </>)}

      {!editable && local.note && (
        <div style={{ background: '#FFF', border: '1px solid #EAE7E1', borderRadius: 12, padding: '13px 14px', display: 'flex', flexDirection: 'column', gap: 6 }}>
          <div style={{ fontSize: 12, fontWeight: 800, color: '#8A867F' }}>בקשה חופשית</div>
          <div style={{ fontSize: 14, lineHeight: 1.6 }}>{local.note}</div>
        </div>
      )}
      {!editable && local.mgrNote && (
        <div style={{ background: '#FFF', border: '1px solid #EAE7E1', borderRadius: 12, padding: '13px 14px', display: 'flex', flexDirection: 'column', gap: 6 }}>
          <div style={{ fontSize: 12, fontWeight: 800, color: '#8A867F' }}>הערה למשבץ</div>
          <div style={{ fontSize: 14, lineHeight: 1.6 }}>{local.mgrNote}</div>
        </div>
      )}
      {!editable && sentAt && <div style={{ fontSize: 12, fontWeight: 600, color: '#8A867F', textAlign: 'center' }}>נשלח לאחרונה: {sentAt}</div>}
      {!editable && !hasMarks && !local.note && !local.mgrNote && (
        <div style={{ padding: '36px 24px', textAlign: 'center', fontSize: 14, color: '#8A867F' }}>לא הגשת בקשות לחודש זה.</div>
      )}
      {criteriaGateOpen && (
        <ConfirmDialog
          title="לא הוגש המינימום שהמשבץ ביקש"
          body={
            <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
              {criteriaWarnings.map((w, i) => <div key={i}>⚠ {w}</div>)}
            </div>
          }
          confirmLabel="לשלוח בכל זאת"
          cancelLabel="לחזור לעריכת הבקשה"
          busy={saving}
          onConfirm={() => { setCriteriaGateOpen(false); submit(); }}
          onCancel={() => setCriteriaGateOpen(false)}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
